<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>tmp embed</title>
<style>html,body{height:100%;margin:0}iframe{width:100%;height:100%;border:0}</style></head>
<body>
<iframe id="atlas" allow="geolocation; fullscreen"></iframe>
<script>
const atlasUrl = '/index.html';
const atlasOrigin = new URL(atlasUrl, location.href).origin;
const frame = document.getElementById('atlas');
frame.addEventListener('load', () => {
  if (new URLSearchParams(location.search).get('handshake') !== '0') {
    frame.contentWindow.postMessage({ type: 'amche:embed', href: location.href }, atlasOrigin);
  }
});
frame.src = atlasUrl + '?atlas=osm&layers=osm-places#10.32/10.8293/76.9541';
</script>
</body></html>
