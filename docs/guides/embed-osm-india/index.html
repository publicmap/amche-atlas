<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenStreetMap India — Map</title>
    <meta name="description" content="A homepage built by embedding a customized Amche Atlas instance.">

    <!--
        A complete, copy-paste homepage that embeds a customized Amche Atlas
        instance instead of hosting one. Implements the approach in
        github.com/osm-in/osm-in.github.io/issues/90.

        Two things are wired up here:

        1. This page -> the atlas. The map is configured through URL
           parameters (see the URL API guide), and the biggest of those is
           `atlas`, pointed here at config/index.atlas.json sitting next to
           this file: the layers this map opens with, and the short list of
           atlases its switcher offers, are ours rather than amche.in's. Any
           parameter already on this page's own URL wins over the default,
           which is what makes a shared link reopen the view it was shared from.

        2. The atlas -> this page. An embedded Amche Atlas posts
           {type: 'url', href} to its parent once the map has loaded and again
           after every map move. Mirroring that onto this page's address bar
           keeps the host URL shareable: copy it mid-pan and it reopens exactly
           where you left it.

        3. This page -> the atlas, again: posting {type: 'amche:embed', href}
           into the frame tells the atlas which page it is embedded in, so its
           own share panel, QR codes and printed exports link back here instead
           of to amche.in. The atlas falls back to the referrer if this message
           never arrives, so it is belt and braces rather than required.

        To adapt it for your own community, change CONFIG and nothing else.
    -->
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #0f172a;
        }

        #atlas {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        #placeholder {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font: 0.9rem -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>

<body>
    <div id="placeholder">Loading the map…</div>

    <!-- Permissions are not inherited across a cross-origin iframe, so each
         one the map uses has to be granted here: geolocation to find the
         visitor, and the motion sensors the compass reads to rotate the map
         with the device. -->
    <iframe id="atlas" title="OpenStreetMap India map"
        allow="geolocation; fullscreen; accelerometer; gyroscope; magnetometer"></iframe>

    <noscript>
        <p style="color:#e7ebf2;font-family:sans-serif;padding:1rem">
            This map needs JavaScript. Open
            <a href="https://amche.in/?atlas=osm" style="color:#ffbf00">amche.in</a> directly instead.
        </p>
    </noscript>

    <script>
        // A browser won't let an https atlas read a config from http://localhost,
        // so while this page is served from a local amche-atlas checkout
        // (npm start) embed that same instance: same origin, config loads,
        // nothing to deploy first. Everywhere else, the public instance.
        const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);

        const CONFIG = {
            // The Amche Atlas instance to embed.
            atlasUrl: isLocal ? new URL('../../../', location.href).href : 'https://amche.in/dev',

            // Our own collection, hosted alongside this page. It must be an
            // absolute URL because the atlas fetches it from its own origin.
            configUrl: new URL('config/index.atlas.json', location.href).href,

            // Default URL parameters - the customization of this instance.
            // Anything here is overridden by the same parameter on this page's URL.
            params: {
                renderer: 'maplibre',
                terrain: '5.5',
                lang: 'ml,en'
            },

            // Opening camera, as zoom/lat/lng/bearing/pitch.
            view: '10.32/10.8293/76.9541/-15.1/42'
        };

        const atlasOrigin = new URL(CONFIG.atlasUrl, location.href).origin;

        function buildSrc() {
            const src = new URL(CONFIG.atlasUrl, location.href);
            const hostParams = new URLSearchParams(location.search);
            src.searchParams.set('atlas', CONFIG.configUrl);
            for (const [key, value] of Object.entries(CONFIG.params)) src.searchParams.set(key, value);
            for (const [key, value] of hostParams) src.searchParams.set(key, value);
            src.hash = location.hash || `#${CONFIG.view}`;
            return src.toString();
        }

        const frame = document.getElementById('atlas');
        frame.addEventListener('load', () => {
            document.getElementById('placeholder')?.remove();
            // Tell the atlas where it is embedded, so the links it offers
            // visitors point back at this page.
            frame.contentWindow.postMessage({ type: 'amche:embed', href: location.href }, atlasOrigin);
        });
        frame.src = buildSrc();

        // Mirror the map's own URL onto this page, so the address bar always
        // describes what the visitor is looking at.
        window.addEventListener('message', (event) => {
            if (event.origin !== atlasOrigin) return;
            if (event.data?.type !== 'url' || typeof event.data.href !== 'string') return;

            const mapUrl = new URL(event.data.href);
            history.replaceState(null, '', location.pathname + mapUrl.search + mapUrl.hash);
        });
    </script>
</body>

</html>
