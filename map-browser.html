                    style: 'color: #9ca3af; font-size: 11px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;',
                    text: atlasData.description.replace(/<[^>]*>/g, '').substring(0, 100)
                });
                $titleContainer.append($description);
            }

            $topRow.append($titleContainer);

            // Only show zoom and link buttons when atlas is expanded
            if (isExpanded) {
                // Count active layers from this atlas
                const activeAtlasLayers = atlasLayers.filter(layer => activeLayers.has(layer.id));
                const activeCount = activeAtlasLayers.length;

                // Remove All button (if 2+ layers are active)
                if (activeCount >= 2) {
                    const $removeAllBtn = $('<button>', {
                        html: '✕ Remove All',
                        title: `Remove all ${activeCount} layers from this atlas`,
                        style: 'background: #dc2626; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; transition: background 0.2s; margin-right: 4px; font-weight: 600;',
                        click: function (e) {
                            e.stopPropagation();
                            // Remove all active layers from this atlas
                            activeAtlasLayers.forEach(layer => {
                                // Optimistically update local state
                                activeLayers.delete(layer.id);
                                loadingLayers.delete(layer.id);

                                // Notify parent
                                window.parent.postMessage({
                                    type: 'layer-toggle',
                                    layerId: layer.id,
                                    active: false
                                }, '*');
                            });

                            // Re-render to hide the button immediately
                            renderLayers();
                        }
                    });
                    $removeAllBtn.on('mouseenter', function () {
                        $(this).css('background', '#b91c1c');
                    }).on('mouseleave', function () {
                        $(this).css('background', '#dc2626');
                    });
                    $topRow.append($removeAllBtn);
                }

                // Zoom button (if atlas has bbox)
                if (atlasData.bbox) {
                    const $zoomBtn = $('<button>', {
                        html: '🔍',
                        title: 'Zoom to atlas and add default layers',
                        style: 'background: #4b5563; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: background 0.2s; margin-right: 4px;',
                        click: function (e) {
                            e.stopPropagation();

                            // Add default layers (initiallyChecked: true) from this atlas
                            const defaultLayers = atlasLayers.filter(layer => layer.initiallyChecked === true);
                            defaultLayers.forEach(layer => {
                                if (!activeLayers.has(layer.id)) {
                                    window.parent.postMessage({
                                        type: 'layer-toggle',
                                        layerId: layer.id,
                                        active: true
                                    }, '*');
                                }
                            });

                            // Zoom to atlas bounds
                            window.parent.postMessage({
                                type: 'zoom-to-bounds',
                                bounds: atlasData.bbox
                            }, '*');
                        }
                    });
                    $zoomBtn.on('mouseenter', function () {
                        $(this).css('background', '#6b7280');
                    }).on('mouseleave', function () {
                        $(this).css('background', '#4b5563');
                    });
                    $topRow.append($zoomBtn);
                }

                // Config link
                const configUrl = `https://raw.githubusercontent.com/publicmap/amche-atlas/refs/heads/dev/config/${atlasId}.atlas.json`;
                const $configLink = $('<a>', {
                    href: configUrl,
                    target: '_blank',
                    rel: 'noopener noreferrer',
                    html: '🔗',
                    title: 'View config file',
                    style: 'text-decoration: none; opacity: 0.6; transition: opacity 0.2s;',
                    click: function (e) { e.stopPropagation(); },
                    mouseenter: function () { $(this).css('opacity', 1); },
                    mouseleave: function () { $(this).css('opacity', 0.6); }
                });
                $topRow.append($configLink);
            }

            // Group visibility eye toggle (first column) - toggles all layers in this atlas
            $header.attr('data-group-layers', atlasLayers.map(l => l.id).join(','));
            const $atlasEye = createEyeToggle(groupEyeState(atlasLayers), function () {
                toggleAtlasLayers(atlasId, atlasLayers);
            });
            $topRow.prepend($atlasEye);

            $header.append($topRow);

            // Expanded layout: render the full atlas description on its own line
            if (isExpanded && atlasData.description) {
                const $descriptionFull = $('<div>', {
                    class: 'atlas-description-full',
                    text: atlasData.description.replace(/<[^>]*>/g, '')
                });
                $header.append($descriptionFull);
            }

            // Hovering an atlas row previews its bbox and boundary geojson on the map
            $header.on('mouseenter', function () {
                window.parent.postMessage({ type: 'atlas-preview', atlasId: atlasId }, '*');
            }).on('mouseleave', function () {
                window.parent.postMessage({ type: 'atlas-clear-preview' }, '*');
            });

            $collapsed.append($header);

            const $layersContainer = $('<div>', {
                class: 'atlas-collapsed-layers'
            });

            // Build tree structure from layers
            const tagTree = buildTagTree(atlasLayers);

            // Render root level children (sorted alphabetically)
            const rootChildNames = Object.keys(tagTree.children).sort();
            rootChildNames.forEach(childName => {
                const childNode = tagTree.children[childName];
                renderTreeNode(atlasId, atlasData, childNode, [childName], $layersContainer, searchTerm);
            });

            // Only show layers if expanded
            if (isExpanded) {
                $collapsed.append($layersContainer);
            }

            $grid.append($collapsed);
        }

        // Add hover handlers to toggle button
        function addToggleButtonHover($btn, isActive, isCollapsed = false) {
            if (!isActive) return;

            const addedHtml = isCollapsed ?
                '<sl-icon name="check-circle" style="font-size: 14px;"></sl-icon><span style="font-size: 11px;">Added</span>' :
                '<sl-icon name="check-circle" style="font-size: 14px;"></sl-icon><span>Added</span>';
            const removeHtml = isCollapsed ?
                '<sl-icon name="dash-circle" style="font-size: 14px;"></sl-icon><span style="font-size: 11px;">Remove</span>' :
                '<sl-icon name="dash-circle" style="font-size: 14px;"></sl-icon><span>Remove</span>';

            $btn.on('mouseenter', function () {
                $(this).addClass('active-hover').html(removeHtml);
            });

            $btn.on('mouseleave', function () {
                $(this).removeClass('active-hover').html(addedHtml);
            });
        }

        // Set the icon/state on an eye visibility toggle
        function setEyeState($eye, state) {
            $eye.removeClass('eye-on eye-off eye-partial').addClass(state);
            let icon, title;
            if (state === 'eye-on') {
                icon = 'eye-fill';
                title = 'Hide from map';
            } else if (state === 'eye-partial') {
                icon = 'eye';
                title = 'Show all';
            } else {
                icon = 'eye-slash';
                title = 'Show on map';
            }
            $eye.html(`<sl-icon name="${icon}" style="font-size: 15px;"></sl-icon>`).attr('title', title);
        }

        // Create an eye visibility toggle button
        function createEyeToggle(state, onClick) {
            const $eye = $('<button>', {
                type: 'button',
                class: 'layer-eye-toggle'
            });
            setEyeState($eye, state);
            $eye.on('click', function (e) {
                e.stopPropagation();
                onClick(e);
            });
            return $eye;
        }

        // Collect all layers under a tree node (including descendants)
        function collectNodeLayers(node) {
            let layers = node.layers ? [...node.layers] : [];
            if (node.children) {
                Object.values(node.children).forEach(child => {
                    layers = layers.concat(collectNodeLayers(child));
                });
            }
            return layers;
        }

        // Determine aggregate eye state for a group of layers
        function groupEyeState(layers) {
            if (!layers.length) return 'eye-off';
            const active = layers.filter(l => activeLayers.has(l.id)).length;
            if (active === 0) return 'eye-off';
            if (active === layers.length) return 'eye-on';
            return 'eye-partial';
        }

        // Toggle visibility for a group of layers (show all if any hidden, else hide all)
        function toggleGroupLayers(layers) {
            const anyActive = layers.some(l => activeLayers.has(l.id));
            layers.forEach(l => {
                const isActive = activeLayers.has(l.id);
                if (anyActive && isActive) {
                    toggleLayer(l.id);
                } else if (!anyActive && !isActive) {
                    toggleLayer(l.id);
                }
            });
            updateGroupEyes();
        }

        // Switch context to a new atlas: hide the previous atlas's currently-visible
        // layers and show the new atlas's initiallyChecked layers. Layers that should
        // stay on for the new atlas are left untouched to avoid needless toggling.
        function switchAtlasContext(previousAtlasId, newAtlasId) {
            const newDefaults = new Set(newAtlasId ? (atlasInitiallyChecked.get(newAtlasId) || []) : []);

            if (previousAtlasId) {
                const prevRefs = atlasLayerReferences.get(previousAtlasId) || [];
                prevRefs.forEach(id => {
                    if (activeLayers.has(id) && !newDefaults.has(id)) {
                        toggleLayer(id);
                    }
                });
                // Drop any stashed visibility so the old context doesn't bleed back in
                atlasVisibilityStash.delete(previousAtlasId);
            }

            newDefaults.forEach(id => {
                if (!activeLayers.has(id)) {
                    toggleLayer(id);
                }
            });

            updateGroupEyes();
        }

        // Toggle visibility for an entire atlas without ever turning every layer on at once.
        // - Nothing visible: restore the previously-visible set if stashed, else show only
        //   initiallyChecked layers (avoids enabling an unexpectedly large set of layers).
        // - Some visible: stash the currently-visible set and hide all.
        function toggleAtlasLayers(atlasId, atlasLayers) {
            const visible = atlasLayers.filter(l => activeLayers.has(l.id));

            if (visible.length > 0) {
                // Stash currently visible layers so they can be restored, then hide all.
                atlasVisibilityStash.set(atlasId, visible.map(l => l.id));
                visible.forEach(l => toggleLayer(l.id));
            } else {
                // Restore previously visible layers, falling back to initiallyChecked defaults.
                const present = new Set(atlasLayers.map(l => l.id));
                const stashed = (atlasVisibilityStash.get(atlasId) || []).filter(id => present.has(id));
                const defaults = (atlasInitiallyChecked.get(atlasId) || []).filter(id => present.has(id));
                let toShow = stashed.length ? stashed : defaults;

                toShow.forEach(id => {
                    if (!activeLayers.has(id)) toggleLayer(id);
                });
            }

            updateGroupEyes();
        }

        // Refresh aggregate eye state on all rendered group headers
        function updateGroupEyes() {
            $('[data-group-layers]').each(function () {
                const ids = ($(this).attr('data-group-layers') || '').split(',').filter(Boolean);
                const state = groupEyeState(ids.map(id => ({ id })));
                setEyeState($(this).find('.layer-eye-toggle').first(), state);
                $(this).toggleClass('has-active-children', state !== 'eye-off');
            });
        }

        // Render a single layer row (compact) or its expanded card
        function renderLayerItem(layer, atlasData, $leafItems, dimmed = false) {

                            expandedLayers.delete(layer.id);
                            renderLayers();

            }

            const isActive = activeLayers.has(layer.id);
            const $layerPreview = $('<div>', {

            const $eye = createEyeToggle(isActive ? 'eye-on' : 'eye-off', function () {

            $content.append($('<div>', {

            $layerPreview.append($actions);

            // On hover, switch meta text to attribution
            if (cleanDesc && cleanAttr) {
                $layerPreview.on('mouseenter', function () {
                    $meta.text(cleanAttr);
                }).on('mouseleave', function () {
                    $meta.text(cleanDesc);
                });
            }

            // Hovering a layer row previews its bbox / geojson on the map
            $layerPreview.on('mouseenter', function () {
                window.parent.postMessage({ type: 'layer-preview', layerId: layer.id }, '*');
            }).on('mouseleave', function () {
                window.parent.postMessage({ type: 'layer-clear-preview' }, '*');
            });

            $leafItems.append($layerPreview);
        }

        // Open layer details in parent modal
        function openLayerDetails(layer) {
            window.parent.postMessage({
                type: 'open-layer-info',
                layer: layer
            }, '*');
        }

        // Preview layer on map
        function previewLayerOnMap(layer) {
            if (!previewMap || !layer.bbox) return;

            // Fit map to layer bbox
            const [west, south, east, north] = layer.bbox;
            previewMap.fitBounds([
                [west, south],
                [east, north]
            ], { padding: 40, duration: 1000 });

            // Remove existing preview layer
            if (previewLayer) {
                if (previewMap.getLayer('preview-layer-fill')) {
                    previewMap.removeLayer('preview-layer-fill');
                }
                if (previewMap.getLayer('preview-layer-line')) {
                    previewMap.removeLayer('preview-layer-line');
                }
                if (previewMap.getSource('preview-layer')) {
                    previewMap.removeSource('preview-layer');
                }
            }

            // Add new preview layer
            const atlasData = atlasMetadata.get(layer._sourceAtlas) || {};
            const color = atlasData.color || '#2563eb';

            previewMap.addSource('preview-layer', {
                type: 'geojson',
                data: {
                    type: 'Feature',
                    properties: {
                        title: layer.title || layer.id
                    },
                    geometry: {
                        type: 'Polygon',
                        coordinates: [[
                            [west, north],
                            [east, north],
                            [east, south],
                            [west, south],
                            [west, north]
                        ]]
                    }
                }
            });

            previewMap.addLayer({
                id: 'preview-layer-fill',
                type: 'fill',
                source: 'preview-layer',
                paint: {
                    'fill-color': color,
                    'fill-opacity': 0.2
                }
            });

            previewMap.addLayer({
                id: 'preview-layer-line',
                type: 'line',
                source: 'preview-layer',
                paint: {
                    'line-color': color,
                    'line-width': 3
                }
            });

            previewLayer = layer.id;

            $('#map-info').text(`Previewing: ${layer.title || layer.id}`);
        }

        // Toggle layer on/off
        function toggleLayer(layerId) {
            const wasActive = activeLayers.has(layerId);

            if (wasActive) {
                activeLayers.delete(layerId);
                loadingLayers.delete(layerId);
                updateCardState(layerId, false);
            } else {
                activeLayers.add(layerId);
                loadingLayers.add(layerId);
                updateCardState(layerId, true, true);

                // Auto-complete loading state after 2 seconds if no confirmation received
                setTimeout(() => {
                    if (loadingLayers.has(layerId)) {
                        loadingLayers.delete(layerId);
                        updateCardState(layerId, true, false);
                    }
                }, 2000);
            }

            // Notify parent
            window.parent.postMessage({
                type: 'layer-toggle',
                layerId: layerId,
                active: !wasActive
            }, '*');

            // When a visibility filter is active, re-render so the toggled layer
            // moves in/out of the filtered list (debounced for group toggles)
            if (visibilityFilter !== 'all') {
                clearTimeout(window._visRenderTimer);
                window._visRenderTimer = setTimeout(renderLayers, 250);
            }
        }

        // Zoom to layer bounds
        function zoomToLayer(layer) {
            // Get bbox from layer or atlas
            let bbox = layer.bbox;

            if (!bbox && layer._sourceAtlas) {
                const atlasData = atlasMetadata.get(layer._sourceAtlas);
                if (atlasData && atlasData.bbox) {
                    bbox = atlasData.bbox;
                }
            }

            if (!bbox) return;

            // Notify parent to zoom
            window.parent.postMessage({
                type: 'zoom-to-bounds',
                bounds: bbox
            }, '*');
        }

        // Update card active state
        function updateCardState(layerId, isActive, isLoading = false) {
            const isLayerLoading = isLoading || loadingLayers.has(layerId);

            // Update expanded layer cards
            const $card = $(`.layer-card[data-layer-id="${layerId}"]`);
            const $btn = $card.find('.toggle-btn');

            // Remove old hover handlers
            $btn.off('mouseenter mouseleave');

            if (isActive && isLayerLoading) {
                $card.addClass('active layer-loading');
                $btn.html('<svg style="width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle;" fill="none" viewBox="0 0 24 24"><circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span style="margin-left: 4px;">Loading...</span>');
                $btn.css('pointer-events', 'none');
            } else if (isActive) {
                $card.addClass('active').removeClass('layer-loading');
                $btn.html('<sl-icon name="check-circle" style="font-size: 14px;"></sl-icon><span>Added</span>');
                $btn.css('pointer-events', '');
                addToggleButtonHover($btn, true, false);
            } else {
                $card.removeClass('active layer-loading');
                $btn.removeClass('active-hover').html('<sl-icon name="plus-circle" style="font-size: 14px;"></sl-icon><span>Add Map</span>');
                $btn.css('pointer-events', '');
            }

            // Update collapsed layer items (eye visibility toggle in first column)
            const $collapsedLayer = $(`.atlas-collapsed-layer[data-layer-id="${layerId}"]`);
            const $eye = $collapsedLayer.find('.layer-eye-toggle');

            if (isActive && isLayerLoading) {
                $collapsedLayer.addClass('active layer-loading');
                $eye.removeClass('eye-off eye-partial').addClass('eye-on')
                    .html('<svg style="width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle;" fill="none" viewBox="0 0 24 24"><circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>')
                    .attr('title', 'Loading layer...');
            } else if (isActive) {
                $collapsedLayer.addClass('active').removeClass('layer-loading');
                setEyeState($eye, 'eye-on');
            } else {
                $collapsedLayer.removeClass('active layer-loading');
                setEyeState($eye, 'eye-off');
            }

            // Keep group header eyes in sync with their member layers
            updateGroupEyes();
        }

        // Update all active states
        function updateActiveStates() {
            // Update expanded cards
            $('.layer-card').each(function () {
                const layerId = $(this).data('layer-id');
                const isActive = activeLayers.has(layerId);
                updateCardState(layerId, isActive);
            });

            // Update collapsed layers
            $('.atlas-collapsed-layer').each(function () {
                const layerId = $(this).data('layer-id');
                const isActive = activeLayers.has(layerId);
                updateCardState(layerId, isActive);
            });
        }

        // Update results count
        function updateResultsCount(filteredLayers, total) {
            const searchTerm = $('#search-input').val().trim();

            const atlasesByLayer = new Set();
            filteredLayers.forEach(layer => {
                atlasesByLayer.add(layer._sourceAtlas);
            });

            const totalAtlases = new Set();
            allLayers.forEach(layer => totalAtlases.add(layer._sourceAtlas));

            const collectionWord = totalAtlases.size === 1 ? 'collection' : 'collections';
            const mapWord = filteredLayers.length === 1 ? 'map' : 'maps';

            let statsText;
            if (searchTerm || visibilityFilter !== 'all') {
                const label = visibilityFilter === 'visible' ? 'visible ' : '';
                statsText = `Showing ${filteredLayers.length} of ${total} ${label}${mapWord}`;
            } else {
                statsText = `${total} ${mapWord} loaded from ${totalAtlases.size} ${collectionWord}`;
            }
            $('#footer-stats').text(statsText);
        }

        // Show preview map modal
        function showPreviewMapModal() {
            $('#preview-map-modal').css('display', 'flex');
            if (previewMap) {
                setTimeout(() => {
                    previewMap.resize();
                }, 100);
            }
        }

        // Hide preview map modal
        function hidePreviewMapModal() {
            $('#preview-map-modal').css('display', 'none');
        }

        // Strip all HTML tags including links, return plain text
        function stripHTML(html) {
            if (!html) return '';
            const $temp = $('<div>').html(html);
            return $temp.text();
        }

        // Process HTML to ensure all links open in new window
        function processLinksForNewWindow(html) {
            if (!html) return '';
            const $temp = $('<div>').html(html);
            $temp.find('a').attr({
                'target': '_blank',
                'rel': 'noopener noreferrer'
            });
            return $temp.html();
        }

        // Debounce helper
        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>
</body>

</html>
