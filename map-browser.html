<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.19.1/cdn/themes/light.css" />
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.19.1/cdn/shoelace-autoloader.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 100vw;
            max-width: 100%;
        }

        .layer-card {
            transition: all 0.2s ease;
            cursor: pointer;
            border-left: 3px solid transparent;
            background-color: #1f2937;
            opacity: 0.6;
        }

        .layer-card:hover {
            transform: translateX(2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            background-color: #374151;
            opacity: 0.8;
        }

        .layer-card.active {
            border-left-color: #3b82f6;
            background-color: #374151;
            opacity: 1;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.3);
        }

        .layer-card h3,
        .layer-card p {
            color: #f3f4f6;
        }

        .layer-card.active .atlas-badge {
            opacity: 1;
        }

        .layer-card[data-type="vector"] {
            border-left-color: #3b82f6;
        }

        .layer-card[data-type="geojson"] {
            border-left-color: #10b981;
        }

        .layer-card[data-type="csv"] {
            border-left-color: #f59e0b;
        }

        .layer-card[data-type="tms"] {
            border-left-color: #8b5cf6;
        }

        .layer-card[data-type="raster-style-layer"],
        .layer-card[data-type="style"] {
            border-left-color: #6b7280;
        }

        .type-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .atlas-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-weight: 600;
        }

        .layer-grid {
            padding: 0;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 8px;
            padding: 0 8px 8px 8px;
        }

        .vis-filter-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.55);
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .vis-filter-toggle sl-icon {
            font-size: 15px;
        }

        .vis-filter-toggle:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .vis-filter-toggle.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }

        .search-input {
            transition: all 0.2s ease;
            background: transparent !important;
            color: #fff !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }

        .search-input:focus {
            outline: none;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            background: rgba(255, 255, 255, 0.05) !important;
        }

        .header-section {
            background: #111827;
            color: white;
            padding: 12px;
            border-bottom: 1px solid #374151;
        }

        .explorer-header {
            background: #111827;
            padding: 14px 12px 12px;
            border-bottom: 1px solid #374151;
        }

        .explorer-title {
            margin: 0 0 10px;
            color: #f3f4f6;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explorer-title sl-icon {
            color: #3b82f6;
            font-size: 20px;
        }

        .atlas-select-wrap {
            position: relative;
        }

        .atlas-select-wrap .select-leading-icon,
        .atlas-select-wrap .select-trailing-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.55);
            pointer-events: none;
        }

        .atlas-select-wrap .select-leading-icon {
            left: 10px;
            font-size: 15px;
        }

        .atlas-select-wrap .select-trailing-icon {
            right: 10px;
            font-size: 14px;
        }

        .atlas-select {
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.05);
            color: #f3f4f6;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            padding: 9px 34px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }

        .atlas-select:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .atlas-select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .atlas-select option {
            background: #1f2937;
            color: #f3f4f6;
        }

        .filter-section {
            background: #1f2937;
            color: white;
            padding: 12px;
            border-bottom: 1px solid #374151;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 768px) {
            body {
                overflow-x: hidden;
            }

            #preview-map-container {
                height: 200px !important;
            }

            .status-bar {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 8px !important;
            }

            .search-section {
                padding: 8px !important;
            }

            .search-section .flex {
                gap: 4px !important;
            }
        }

        .toggle-btn,
        .zoom-btn {
            transition: all 0.2s ease;
        }

        .toggle-btn:hover,
        .zoom-btn:hover {
            transform: scale(1.05);
        }

        .toggle-btn {
            background-color: #10b981;
        }

        .toggle-btn:hover {
            background-color: #059669;
        }

        .toggle-btn.active-hover {
            background-color: #dc2626;
        }

        .toggle-btn.active-hover:hover {
            background-color: #b91c1c;
        }

        .zoom-btn {
            background-color: #6b7280;
        }

        .zoom-btn:hover {
            background-color: #4b5563;
        }


        .scrollbar-thin::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: #111827;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        #preview-map {
            width: 100%;
            height: 100%;
        }

        .mapboxgl-ctrl-logo {
            display: none !important;
        }

        #search-options[open] summary span {
            transform: rotate(90deg);
        }

        #search-options summary span {
            display: inline-block;
            transition: transform 0.2s;
        }

        #search-options summary::-webkit-details-marker {
            display: none;
        }

        .atlas-heading {
            font-size: 15px;
            font-weight: 600;
            color: #f3f4f6;
            padding: 20px 12px 4px;
            background: #111827;
        }

        .atlas-meta {
            font-size: 11px;
            color: #9ca3af;
            padding: 0 12px 12px;
            line-height: 1.5;
            background: #111827;
        }

        .atlas-meta .area {
            font-weight: 600;
            color: #d1d5db;
        }

        .tag-heading {
            font-size: 13px;
            font-weight: 600;
            color: #9ca3af;
            padding: 12px 12px 8px;
            background: #111827;
            text-transform: capitalize;
        }

        .atlas-collapsed {
            background: #1f2937;
            margin: 0;
            border-bottom: 1px solid black;
            transition: background 0.2s;
            padding: 0;
        }

        .atlas-collapsed-header {
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            padding: 6px 8px;
        }

        .atlas-collapsed-header:hover {
            background-color: #374151;
            border-radius: 4px;
        }

        /* Top row wraps eye + icon + title + actions so the expanded layout can
           drop the full description onto its own line below it */
        .atlas-header-top-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-width: 0;
        }

        /* Atlas row with a header image: paint it scaled-to-fill and centered,
           in both the collapsed and expanded states */
        .atlas-collapsed-header.has-bg {
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Darkening overlay keeps the row text legible over the image */
        .atlas-collapsed-header.has-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(17, 24, 39, 0.55), rgba(17, 24, 39, 0.88));
            pointer-events: none;
        }

        .atlas-collapsed-header.has-bg > * {
            position: relative;
            z-index: 1;
        }

        /* Expanded atlas row: stack the header content vertically so the full
           description can sit on its own line below the top row */
        .atlas-collapsed-header.expanded {
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            padding: 12px;
        }

        .atlas-description-full {
            color: #e5e7eb;
            font-size: 12px;
            line-height: 1.5;
            font-weight: 400;
        }

        .atlas-expand-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            line-height: 14px;
            text-align: center;
            color: #9ca3af;
            font-weight: bold;
            flex-shrink: 0;
            font-size: 11px;
        }

        .atlas-collapsed-layers {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding-left: 16px;
            margin-top: 0;
            margin-bottom: 4px;
        }

        .atlas-collapsed-tag-group {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .atlas-collapsed-tag-label {
            font-size: 11px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: capitalize;
            padding-left: 8px;
            margin-bottom: 2px;
        }

        .atlas-collapsed-layer {
            display: grid;
            grid-template-columns: 28px 40px 1fr auto;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #d1d5db;
            cursor: pointer;
            transition: background 0.2s;
            padding: 3px 8px;
            border-radius: 0;
        }

        /* Visibility eye toggle (first column of layers and groups) -
           a distinct square button so the primary action is an obvious, high-contrast target */
        .layer-eye-toggle {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
            border-radius: 5px;
            flex-shrink: 0;
            padding: 0;
            color: #9ca3af;
            transition: color 0.15s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
        }

        .layer-eye-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.4);
            color: #f3f4f6;
        }

        .layer-eye-toggle:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.6);
        }

        /* Visible: solid amber fill with dark icon for unambiguous high contrast */
        .layer-eye-toggle.eye-on {
            background: #f59e0b;
            border-color: #f59e0b;
            color: #1f2937;
        }

        .layer-eye-toggle.eye-on:hover {
            background: #fbbf24;
            border-color: #fbbf24;
            color: #1f2937;
        }

        /* Partially visible: amber outline + tint (already legible, kept) */
        .layer-eye-toggle.eye-partial {
            background: rgba(245, 158, 11, 0.18);
            border-color: #f59e0b;
            color: #fbbf24;
        }

        .layer-eye-toggle.eye-partial:hover {
            background: rgba(245, 158, 11, 0.28);
            border-color: #fbbf24;
            color: #fcd34d;
        }

        /* Hidden: muted but still clearly an outlined target */
        .layer-eye-toggle.eye-off {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.18);
            color: #9ca3af;
        }

        .atlas-collapsed-layer:hover .layer-eye-toggle.eye-off,
        .tree-node-header:hover .layer-eye-toggle.eye-off,
        .atlas-collapsed-header:hover .layer-eye-toggle.eye-off {
            color: #f3f4f6;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .atlas-collapsed-layer:hover {
            background: #374151;
        }

        .atlas-collapsed-layer img,
        .atlas-collapsed-layer canvas {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .atlas-collapsed-layer-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }

        .atlas-collapsed-layer-title {
            font-weight: 500;
            margin-bottom: 2px;
        }

        .atlas-collapsed-layer-meta {
            font-size: 11px;
            color: #9ca3af;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.2s;
        }

        .atlas-collapsed-layer:hover .atlas-collapsed-layer-meta {
            color: #d1d5db;
            font-style: italic;
        }

        .atlas-collapsed-layer-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            align-items: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .atlas-collapsed-layer:hover .atlas-collapsed-layer-actions,
        .atlas-collapsed-layer.active .atlas-collapsed-layer-actions {
            opacity: 1;
        }

        .atlas-collapsed-layer.active {
            background: #374151;
            border-left: 2px solid #3b82f6;
            padding-left: 6px;
        }

        .atlas-collapsed-layer-btn {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .atlas-collapsed-layer-btn.zoom {
            background: #6b7280;
            color: white;
        }

        .atlas-collapsed-layer-btn.zoom:hover {
            background: #4b5563;
            transform: scale(1.1);
        }

        .atlas-collapsed-layer-btn.toggle {
            background: #10b981;
            color: white;
            gap: 4px;
            padding: 0 8px;
            width: auto;
        }

        .atlas-collapsed-layer-btn.toggle:hover {
            background: #059669;
            transform: scale(1.05);
        }

        .atlas-collapsed-layer-btn.toggle.active-hover {
            background: #dc2626;
        }

        .atlas-collapsed-layer-btn.toggle.active-hover:hover {
            background: #b91c1c;
        }

        .atlas-collapsed-layer-btn.toggle.inactive {
            background: #10b981;
        }

        .atlas-collapsed-layer-btn.toggle.inactive:hover {
            background: #059669;
        }

        .layer-card a,
        .inspection-content a {
            color: #60a5fa;
            text-decoration: underline;
            cursor: pointer;
        }

        .layer-card a:hover,
        .inspection-content a:hover {
            color: #93c5fd;
        }

        .atlas-collapsed-layer-expanded {
            margin-left: 0;
            margin-top: 8px;
            margin-bottom: 8px;
            overflow: visible;
            animation: expandCard 0.1s ease-out forwards;
            transform-origin: left center;
        }

        .atlas-collapsed-layer-expanded .layer-card {
            margin: 0;
        }

        .atlas-collapsed-layer-expanded.collapsing {
            animation: collapseCard 0.1s ease-out forwards;
        }

        @keyframes expandCard {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes collapseCard {
            from {
                transform: scale(1);
                opacity: 1;
            }

            to {
                transform: scale(0.9);
                opacity: 0;
            }
        }

        .atlas-collapsed-more {
            font-size: 11px;
            color: #9ca3af;
            padding-left: 8px;
            margin-top: 4px;
        }

        .layer-loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .tree-node {
            margin-left: 0;
            margin-bottom: 0;
        }

        .tree-node-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 0;
            margin-bottom: 0;
            min-height: 28px;
        }

        .tree-node-header:hover {
            background: #374151;
        }

        .tree-node-header.has-active-children {
            background: rgba(59, 130, 246, 0.15);
        }

        .tree-node-header.has-active-children:hover {
            background: rgba(59, 130, 246, 0.25);
        }

        .tree-node-header-content {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .tree-expand-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            line-height: 12px;
            text-align: center;
            color: #9ca3af;
            font-size: 9px;
            flex-shrink: 0;
            margin-right: 4px;
            transition: transform 0.2s;
        }

        .tree-node.expanded > .tree-node-header .tree-expand-icon {
            transform: rotate(90deg);
        }

        .tree-node-label {
            font-size: 11px;
            font-weight: 600;
            color: #d1d5db;
            text-transform: capitalize;
            white-space: nowrap;
            flex-shrink: 0;
            line-height: 1.2;
        }

        .tree-node-count {
            font-size: 9px;
            color: #9ca3af;
            white-space: nowrap;
            flex-shrink: 0;
            padding: 2px 5px;
            background: #374151;
            border-radius: 3px;
            font-weight: 600;
            line-height: 1.2;
        }

        .tree-node-children {
            margin-left: 16px;
            display: none;
            margin-top: 0;
        }

        .tree-node.expanded > .tree-node-children {
            display: block;
        }

        .tree-leaf-items {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-top: 0;
        }

        .tree-node-preview {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
            font-size: 10px;
            color: #9ca3af;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 2px 0;
        }

        .tree-node-preview::-webkit-scrollbar {
            height: 3px;
        }

        .tree-node-preview::-webkit-scrollbar-track {
            background: transparent;
        }

        .tree-node-preview::-webkit-scrollbar-thumb {
            background: #6b7280;
            border-radius: 2px;
        }

        .tree-node-preview::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        .tree-node-preview-category {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 6px;
            background: #374151;
            border-radius: 3px;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .tree-node-preview-category:hover {
            background: #4b5563;
        }

        .tree-node-preview-category.has-active {
            background: rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }

        .tree-node-preview-separator {
            color: #6b7280;
            flex-shrink: 0;
            user-select: none;
        }

        .tree-node-preview-layers {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .tree-node-preview-layer {
            width: 24px;
            height: 24px;
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #4b5563;
            position: relative;
            flex-shrink: 0;
        }

        .tree-node-preview-layer:hover {
            transform: scale(1.3);
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .tree-node-preview-layer.active {
            border: 2px solid #3b82f6;
            box-shadow: 0 0 6px rgba(59, 130, 246, 0.6);
        }

        .tree-node-preview-layer .layer-thumbnail {
            pointer-events: none;
        }

        .atlas-collapsed-header.has-active-children {
            background-color: rgba(59, 130, 246, 0.1);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-gray-900">
    <div class="flex flex-col h-screen max-w-[600px] w-full" style="margin: 0 auto;">
        <!-- Atlas Explorer Header -->
        <div class="explorer-header">
            <h1 class="explorer-title">
                <sl-icon name="globe-americas"></sl-icon>
                Atlas Explorer
            </h1>
            <div class="atlas-select-wrap">
                <sl-icon name="collection" class="select-leading-icon"></sl-icon>
                <select id="atlas-select" class="atlas-select" aria-label="Select atlas"></select>
                <sl-icon name="chevron-down" class="select-trailing-icon"></sl-icon>
            </div>
        </div>

        <!-- Search Section -->
        <div class="search-section" style="background: #1f2937; padding: 10px 12px; border-bottom: 1px solid #374151;">
            <!-- Search Row -->
            <div class="flex items-center gap-2" style="min-width: 0;">
                <!-- Visibility Filter Toggle (off = all, on = visible only) -->
                <button id="visibility-filter" class="vis-filter-toggle" type="button"
                    title="Show visible maps only" aria-pressed="false">
                    <sl-icon name="eye"></sl-icon>
                    <span>Visible</span>
                </button>
                <!-- Search Input -->
                <div class="relative flex-1 min-w-0">
                    <sl-icon name="search"
                        style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.55); font-size: 14px; pointer-events: none;"></sl-icon>
                    <input type="text" id="search-input" placeholder="Filter by map name"
                        class="search-input w-full rounded text-sm"
                        style="padding: 8px 32px 8px 32px; font-size: 14px;" />
                    <button id="clear-search-btn"
                        class="absolute right-2 top-1/2 -translate-y-1/2"
                        style="display: none; background: transparent; border: none; color: rgba(255,255,255,0.6); cursor: pointer; padding: 2px;">
                        ✕
                    </button>
                </div>
            </div>

        </div>

        <!-- Results Section -->
        <div class="flex flex-col flex-1 min-h-0">
            <!-- Layer Grid -->
            <div id="layer-container" class="flex-1 min-h-0 overflow-y-auto scrollbar-thin">
                <div id="layer-grid" class="layer-grid"></div>
            </div>

        </div>

        <!-- Sticky Footer -->
        <div class="browser-footer"
            style="background: #111827; border-top: 1px solid #374151; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;">
            <div id="footer-stats" style="color: #9ca3af; font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                Loading maps...
            </div>
            <button id="add-new-map-link"
                style="background: #16a34a; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
                <sl-icon name="plus-circle" style="font-size: 14px;"></sl-icon>
                <span>New Map</span>
            </button>
        </div>
    </div>

    <!-- Preview Map Modal -->
    <div id="preview-map-modal"
        style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 9999; align-items: center; justify-content: center;">
        <div
            style="background: #1f2937; border-radius: 8px; width: 90%; max-width: 600px; max-height: 80%; overflow: hidden; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);">
            <!-- Header -->
            <div
                style="padding: 12px 16px; border-bottom: 1px solid #374151; display: flex; align-items: center; justify-content: space-between;">
                <div style="color: white; font-weight: 600; font-size: 14px;">Preview & Filter Map</div>
                <button id="close-map-modal"
                    style="width: 28px; height: 28px; border-radius: 4px; background: #374151; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s;"
                    onmouseover="this.style.background='#4b5563'" onmouseout="this.style.background='#374151'">
                    ✕
                </button>
            </div>
            <!-- Map Container -->
            <div id="preview-map-container" style="height: 400px;">
                <div id="preview-map" style="width: 100%; height: 100%;"></div>
            </div>
            <!-- Footer -->
            <div style="padding: 8px 16px; border-top: 1px solid #374151; background: #111827;">
                <div id="map-info" style="color: #9ca3af; font-size: 11px;">Move map to filter by area</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { LayerThumbnail } from './js/layer-thumbnail.js';
        import { MapUtils } from './js/map-utils.js';

        // State
        let allLayers = [];
        let activeLayers = new Set();
        let atlasMetadata = new Map();
        let atlasLayerReferences = new Map();
        let atlasInitiallyChecked = new Map(); // atlasId -> [layerId] flagged initiallyChecked in config
        let currentBounds = null;
        let layerDefaults = {};
        let previewMap = null;
        let previewLayer = null;
        let bboxLayers = [];
        let mapboxAccessToken = null;
        let expandedLayers = new Set();
        let expandedAtlasId = null; // Track which single atlas is expanded
        let userCollapsedAll = false; // Track if user explicitly collapsed all atlases
        let userManuallyExpandedAtlas = false; // Track if user manually expanded a different atlas
        let userHasInteractedWithAtlas = false; // Track if user has clicked any atlas header
        let selectedFeatures = new Map(); // layerId -> Map<featureId, feature>
        let featureCustomHTML = new Map(); // layerId -> Map<featureId, HTML>
        let loadingLayers = new Set(); // Track layers currently loading
        let atlasVisibilityStash = new Map(); // atlasId -> [layerId] previously visible before hide-all
        let expandedTreeNodes = new Map(); // Track expanded tree nodes per atlas
        let showMoreNodes = new Map(); // Track which nodes should show hidden non-matching layers
        let visibilityFilter = 'all'; // Filter layers by visibility: 'all' | 'visible' | 'hidden'

        // Make LayerThumbnail available globally for use in functions
        window.LayerThumbnail = LayerThumbnail;

        // Initialize
        $(document).ready(function () {
            setupMessageListener();
            setupEventListeners();
            requestLayerData();

            // Auto-focus search input when browser opens for first time
            setTimeout(() => {
                const searchInput = document.getElementById('search-input');
                if (searchInput) {
                    searchInput.focus();
                    console.log('[Browser] Initial auto-focus on page load');
                }
            }, 300);
        });

        // Request layer data from parent
        function requestLayerData() {
            window.parent.postMessage({
                type: 'request-layer-data'
            }, '*');
        }

        // Setup message listener for parent communication
        function setupMessageListener() {
            window.addEventListener('message', function (event) {
                if (event.data.type === 'layer-data') {
                    allLayers = event.data.layers || [];
                    activeLayers = new Set(event.data.activeLayers || []);
                    atlasMetadata = new Map(Object.entries(event.data.atlasMetadata || {}));
                    atlasLayerReferences = new Map(Object.entries(event.data.atlasLayerReferences || {}));
                    atlasInitiallyChecked = new Map(Object.entries(event.data.atlasInitiallyChecked || {}));
                    currentBounds = event.data.bounds;
                    mapboxAccessToken = event.data.mapboxToken;
                    layerDefaults = event.data.layerDefaults || {};

                    // Check for atlas selection from URL parameter first
                    if (event.data.selectedAtlasId && atlasMetadata.has(event.data.selectedAtlasId)) {
                        const metadata = atlasMetadata.get(event.data.selectedAtlasId);
                        selectAtlas(event.data.selectedAtlasId, metadata.name || event.data.selectedAtlasId, true);
                    } else if (!window.selectedAtlasId) {
                        // Check for imported atlas and auto-select it
                        for (const [atlasId, metadata] of atlasMetadata.entries()) {
                            if (metadata.isImported) {
                                window.selectedAtlasId = atlasId;
                                // label stays as 'Map Atlas'
                                break;
                            }
                        }
                    }

                    populateAtlasSelect();
                    initializePreviewMap();
                    renderLayers();
                    drawBboxes();

                    // Notify parent that browser is ready and rendered
                    window.parent.postMessage({
                        type: 'browser-ready'
                    }, '*');
                }

                if (event.data.type === 'active-layers-update') {
                    activeLayers = new Set(event.data.activeLayers || []);
                    updateActiveStates();
                }

                if (event.data.type === 'layer-loaded') {
                    const layerId = event.data.layerId;
                    loadingLayers.delete(layerId);
                    updateCardState(layerId, true);
                }

                if (event.data.type === 'layer-load-failed') {
                    const layerId = event.data.layerId;
                    loadingLayers.delete(layerId);
                    activeLayers.delete(layerId);
                    updateCardState(layerId, false);
                }

                if (event.data.type === 'bounds-update') {
                    currentBounds = event.data.bounds;
                    renderLayers();
                }

                if (event.data.type === 'feature-selected') {
                    const layerId = event.data.layerId;
                    const feature = event.data.feature;
                    const featureId = event.data.featureId;

                    console.log('[Browser] Feature selected:', layerId, featureId);

                    if (!selectedFeatures.has(layerId)) {
                        selectedFeatures.set(layerId, new Map());
                    }
                    selectedFeatures.get(layerId).set(featureId, feature);

                    renderLayers();
                }

                if (event.data.type === 'feature-inspection-data') {
                    const layerId = event.data.layerId;
                    const featureId = event.data.featureId;
                    const customHTML = event.data.customHTML;

                    console.log('[Browser] Feature inspection data:', layerId, featureId, customHTML ? 'HTML present' : 'no HTML');

                    if (!featureCustomHTML.has(layerId)) {
                        featureCustomHTML.set(layerId, new Map());
                    }
                    featureCustomHTML.get(layerId).set(featureId, customHTML);

                    renderLayers();
                }

                if (event.data.type === 'feature-deselected') {
                    const layerId = event.data.layerId;
                    const featureId = event.data.featureId;

                    console.log('[Browser] Feature deselected:', layerId, featureId);

                    if (selectedFeatures.has(layerId)) {
                        selectedFeatures.get(layerId).delete(featureId);
                        if (selectedFeatures.get(layerId).size === 0) {
                            selectedFeatures.delete(layerId);
                        }
                    }

                    if (featureCustomHTML.has(layerId)) {
                        featureCustomHTML.get(layerId).delete(featureId);
                        if (featureCustomHTML.get(layerId).size === 0) {
                            featureCustomHTML.delete(layerId);
                        }
                    }

                    renderLayers();
                }

                if (event.data.type === 'focus-search') {
                    const searchInput = document.getElementById('search-input');
                    if (searchInput) {
                        searchInput.focus();
                        console.log('[Browser] Search input focused via message');
                    }
                }
            });
        }

        // Initialize preview map
        function initializePreviewMap() {
            if (previewMap || !mapboxAccessToken) return;

            mapboxgl.accessToken = mapboxAccessToken;

            previewMap = new mapboxgl.Map({
                container: 'preview-map',
                style: 'mapbox://styles/mapbox/light-v11',
                center: currentBounds ?
                    [(currentBounds[0] + currentBounds[2]) / 2, (currentBounds[1] + currentBounds[3]) / 2] :
                    [0, 0],
                zoom: 1,
                attributionControl: false
            });

            previewMap.on('moveend', function () {
                const bounds = previewMap.getBounds();
                currentBounds = [
                    bounds.getWest(),
                    bounds.getSouth(),
                    bounds.getEast(),
                    bounds.getNorth()
                ];

                renderLayers();
                updateMapInfo();
            });

            previewMap.on('load', function () {
                if (currentBounds) {
                    previewMap.fitBounds([
                        [currentBounds[0], currentBounds[1]],
                        [currentBounds[2], currentBounds[3]]
                    ], { padding: 20, animate: false });
                }
            });
        }

        // Draw bboxes on preview map
        function drawBboxes() {
            if (!previewMap || !previewMap.loaded()) {
                setTimeout(drawBboxes, 100);
                return;
            }

            // Remove existing bbox layers
            bboxLayers.forEach(layerId => {
                if (previewMap.getLayer(layerId)) {
                    previewMap.removeLayer(layerId);
                }
                if (previewMap.getSource(layerId)) {
                    previewMap.removeSource(layerId);
                }
            });
            bboxLayers = [];

            // Add atlas bboxes
            atlasMetadata.forEach((metadata, atlasId) => {
                if (!metadata.bbox) return;

                const [west, south, east, north] = metadata.bbox;
                const sourceId = `bbox-${atlasId}`;

                previewMap.addSource(sourceId, {
                    type: 'geojson',
                    data: {
                        type: 'Feature',
                        geometry: {
                            type: 'Polygon',
                            coordinates: [[
                                [west, north],
                                [east, north],
                                [east, south],
                                [west, south],
                                [west, north]
                            ]]
                        }
                    }
                });

                previewMap.addLayer({
                    id: sourceId,
                    type: 'line',
                    source: sourceId,
                    paint: {
                        'line-color': metadata.color || '#2563eb',
                        'line-width': 2,
                        'line-opacity': 0.6
                    }
                });

                bboxLayers.push(sourceId);
            });
        }

        // Update map info
        function updateMapInfo() {
            const zoom = previewMap ? previewMap.getZoom().toFixed(1) : '0';
            $('#map-info').text(`Zoom: ${zoom} - Move map to filter by area`);
        }

        // Setup UI event listeners
        function setupEventListeners() {
            $('#search-input').on('input', function () {
                const value = $(this).val();
                if (value) {
                    $('#clear-search-btn').show();
                } else {
                    $('#clear-search-btn').hide();
                    // Clear show more state when search is cleared
                    showMoreNodes.clear();
                }
                // Clear show more state on search change
                showMoreNodes.clear();
                debounce(renderLayers, 300)();
            });

            $('#clear-search-btn').on('click', function () {
                $('#search-input').val('').trigger('input');
            });

            // Visibility filter toggle (off = all, on = visible only)
            $('#visibility-filter').on('click', function () {
                visibilityFilter = visibilityFilter === 'visible' ? 'all' : 'visible';
                const isOn = visibilityFilter === 'visible';
                $(this).toggleClass('active', isOn).attr('aria-pressed', isOn);
                showMoreNodes.clear();
                renderLayers();
            });


            // Atlas dropdown - synced to the ?atlas URL param.
            // Changing the atlas switches context: the previous atlas's visible
            // layers are hidden and the new atlas's initiallyChecked layers shown.
            $('#atlas-select').on('change', function () {
                const newAtlasId = $(this).val();
                // No atlas selected yet means the index atlas is the effective context
                const previousAtlasId = window.selectedAtlasId || 'index';
                const metadata = newAtlasId ? atlasMetadata.get(newAtlasId) : null;

                switchAtlasContext(previousAtlasId, newAtlasId);
                selectAtlas(newAtlasId, metadata?.name || newAtlasId);
            });

            $('#add-new-map-link').on('click', function () {
                window.parent.postMessage({ type: 'open-creator' }, '*');
            });

            // Add new map button hover effects
            $('#add-new-map-link').on('mouseenter', function () {
                $(this).css('background', '#15803d');
            }).on('mouseleave', function () {
                $(this).css('background', '#16a34a');
            });

            $('#close-map-modal').on('click', function () {
                hidePreviewMapModal();
            });

            $('#preview-map-modal').on('click', function (e) {
                if (e.target.id === 'preview-map-modal') {
                    hidePreviewMapModal();
                }
            });
        }

        // Populate the atlas dropdown from atlas metadata, sorted alphabetically by name.
        // Synced to the ?atlas URL param via selectAtlas().
        function populateAtlasSelect() {
            const $select = $('#atlas-select');
            if (!$select.length) return;

            $select.empty();

            const entries = Array.from(atlasMetadata.entries())
                .sort((a, b) => (a[1].name || a[0]).localeCompare(b[1].name || b[0]));

            entries.forEach(([atlasId, metadata]) => {
                $select.append($('<option>', {
                    value: atlasId,
                    text: metadata.name || atlasId
                }));
            });

            // Fall back to the index atlas when nothing else is selected
            $select.val(window.selectedAtlasId || 'index');
        }

        // Select atlas (expand it in the list)
        function selectAtlas(atlasId, atlasName, skipURLUpdate = false) {
            window.selectedAtlasId = atlasId;

            // Keep the dropdown in sync when selection changes from elsewhere,
            // defaulting to the index atlas when nothing is selected
            $('#atlas-select').val(atlasId || 'index');

            // Update label text based on selected atlas
            if (atlasId && atlasMetadata.has(atlasId)) {
                // Expand the selected atlas
                expandedAtlasId = atlasId;
                userCollapsedAll = false;
                userManuallyExpandedAtlas = false;
            } else {

                // When "All" is selected, expand first atlas
                expandedAtlasId = null;
                userCollapsedAll = false;
                userManuallyExpandedAtlas = false;
            }

            renderLayers();

            // Notify parent to update URL with atlas parameter (unless this is from URL initialization)
            if (!skipURLUpdate) {
                window.parent.postMessage({
                    type: 'update-atlas-param',
                    atlasId: atlasId || ''
                }, '*');
            }

            // Scroll to the selected atlas after rendering
            if (atlasId) {
                setTimeout(() => {
                    document.getElementById(`atlas-${atlasId}`)?.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }, 200);
            }
        }

        // Check if layer is a global/world layer
        function isGlobalLayerCheck(layer, atlasData) {
            return MapUtils.isGlobalLayer(layer, atlasData);
        }

        // Render filtered layers
        function renderLayers() {
            const searchTerm = $('#search-input').val().toLowerCase().trim();

            const filtered = allLayers.filter(layer => {
                // Search filter
                if (searchTerm && !matchesSearch(layer, searchTerm)) {
                    return false;
                }

                // Visibility filter (on = visible/active layers only)
                if (visibilityFilter === 'visible' && !activeLayers.has(layer.id)) {
                    return false;
                }

                return true;
            });

            renderLayerGrid(filtered, searchTerm);
            updateResultsCount(filtered, allLayers.length);

        }

        // Check if layer matches search
        function matchesSearch(layer, term) {
            const descText = layer.description ? stripHTML(layer.description).toLowerCase() : '';
            return (layer.id && layer.id.toLowerCase().includes(term)) ||
                (layer.title && layer.title.toLowerCase().includes(term)) ||
                descText.includes(term) ||
                (layer.tags && layer.tags.some(tag => tag.toLowerCase().includes(term)));
        }

        // Get search relevance score for a layer (higher = better match)
        function getSearchScore(layer, term) {
            const title = (layer.title || layer.id || '').toLowerCase();
            const descText = layer.description ? stripHTML(layer.description).toLowerCase() : '';
            let score = 0;
            if (title === term) score += 100;
            else if (title.startsWith(term)) score += 80;
            else if (title.includes(term)) score += 60;
            if (descText.includes(term)) score += 40;
            if (layer.tags && layer.tags.some(tag => tag.toLowerCase().includes(term))) score += 20;
            if (layer.id && layer.id.toLowerCase().includes(term)) score += 10;
            return score;
        }

        // Check if layer is in current view
        function isInView(layer) {
            // If layer has no bbox, check if it should inherit atlas bbox
            if (!layer.bbox && layer._sourceAtlas) {
                const atlasData = atlasMetadata.get(layer._sourceAtlas);
                if (atlasData?.bbox) {
                    // Create a temporary layer object with atlas bbox for checking
                    const layerWithAtlasBbox = { ...layer, bbox: atlasData.bbox };
                    return MapUtils.isLayerInView(layerWithAtlasBbox, currentBounds);
                }
            }
            return MapUtils.isLayerInView(layer, currentBounds);
        }

        // Calculate atlas bbox area
        function calculateAtlasBboxArea(atlasId) {
            const atlasData = atlasMetadata.get(atlasId);
            if (!atlasData || !atlasData.bbox) return Infinity;
            return MapUtils.calculateBboxArea(atlasData.bbox);
        }

        // Calculate distance from atlas center to current view center
        function calculateAtlasDistanceFromView(atlasId) {
            if (!currentBounds) return Infinity;

            const atlasData = atlasMetadata.get(atlasId);
            if (!atlasData || !atlasData.bbox) return Infinity;

            const [boundsW, boundsS, boundsE, boundsN] = currentBounds;
            const boundsCenterLng = (boundsW + boundsE) / 2;
            const boundsCenterLat = (boundsS + boundsN) / 2;

            return MapUtils.calculateBboxDistance(atlasData.bbox, boundsCenterLng, boundsCenterLat);
        }

        // Get tag string for a layer
        function getLayerTagString(layer) {
            if (!layer.tags || layer.tags.length === 0) {
                return 'Uncategorized';
            }
            return layer.tags.map(tag =>
                tag.charAt(0).toUpperCase() + tag.slice(1)
            ).join('/');
        }

        // Build tree structure from flat tag strings
        function buildTagTree(layers) {
            const tree = {
                children: {},
                layers: []
            };

            layers.forEach(layer => {
                const tagString = getLayerTagString(layer);
                const parts = tagString.split('/');

                let currentNode = tree;
                parts.forEach((part, index) => {
                    if (!currentNode.children[part]) {
                        currentNode.children[part] = {
                            name: part,
                            children: {},
                            layers: []
                        };
                    }
                    currentNode = currentNode.children[part];

                    // Add layer to leaf node
                    if (index === parts.length - 1) {
                        currentNode.layers.push(layer);
                    }
                });
            });

            return tree;
        }

        // Check if a node or its descendants have active layers
        function hasActiveDescendants(node) {
            // Check layers at this node
            if (node.layers && node.layers.some(layer => activeLayers.has(layer.id))) {
                return true;
            }

            // Check child nodes recursively
            if (node.children) {
                for (const childName in node.children) {
                    if (hasActiveDescendants(node.children[childName])) {
                        return true;
                    }
                }
            }

            return false;
        }

        // Check if a node or its descendants have layers matching search
        function nodeContainsSearchMatch(node, searchTerm) {
            if (!searchTerm) return false;

            // Check layers at this node
            if (node.layers && node.layers.some(layer => matchesSearch(layer, searchTerm))) {
                return true;
            }

            // Check child nodes recursively
            if (node.children) {
                for (const childName in node.children) {
                    if (nodeContainsSearchMatch(node.children[childName], searchTerm)) {
                        return true;
                    }
                }
            }

            return false;
        }

        // Auto-expand tree to show active layers
        function autoExpandToActiveLayers(atlasId) {
            if (!expandedTreeNodes.has(atlasId)) {
                expandedTreeNodes.set(atlasId, new Set());
            }
            const atlasExpanded = expandedTreeNodes.get(atlasId);

            // Find all paths to active layers
            const atlasLayers = allLayers.filter(layer => layer._sourceAtlas === atlasId);
            atlasLayers.forEach(layer => {
                if (activeLayers.has(layer.id)) {
                    // Get path to this layer
                    const tagString = getLayerTagString(layer);
                    const parts = tagString.split('/');

                    // Expand all parent nodes
                    for (let i = 0; i < parts.length; i++) {
                        const pathParts = parts.slice(0, i + 1);
                        const nodePath = getTreeNodePath(atlasId, pathParts);
                        atlasExpanded.add(nodePath);
                    }
                }
            });
        }

        // Generate collapsed preview for a tree node
        function generateCollapsedPreview(atlasId, atlasData, node, pathParts) {
            const $preview = $('<div>', {
                class: 'tree-node-preview'
            });

            // Get direct children (categories)
            const childNames = Object.keys(node.children).sort();

            // Add child category badges
            childNames.forEach((childName, index) => {
                const childNode = node.children[childName];
                const childCount = countLayers(childNode);
                const hasActive = hasActiveDescendants(childNode);

                const $category = $('<div>', {
                    class: 'tree-node-preview-category' + (hasActive ? ' has-active' : ''),
                    text: `${childName} (${childCount})`,
                    title: `${childName} (${childCount})`
                });
                $preview.append($category);

                // Add separator if not last
                if (index < childNames.length - 1 || node.layers.length > 0) {
                    $preview.append($('<span>', {
                        class: 'tree-node-preview-separator',
                        text: '|'
                    }));
                }
            });

            // Add direct child layer thumbnails
            if (node.layers.length > 0) {
                const $layersContainer = $('<div>', {
                    class: 'tree-node-preview-layers'
                });

                // Sort layers: active first, then alphabetically
                const sortedLayers = [...node.layers].sort((a, b) => {
                    const aActive = activeLayers.has(a.id);
                    const bActive = activeLayers.has(b.id);

                    if (aActive && !bActive) return -1;
                    if (!aActive && bActive) return 1;

                    const aName = (a.name || a.title || a.id || '').toLowerCase();
                    const bName = (b.name || b.title || b.id || '').toLowerCase();
                    return aName.localeCompare(bName);
                });

                sortedLayers.forEach(layer => {
                    const isActive = activeLayers.has(layer.id);
                    const thumbnail = window.LayerThumbnail.generate(layer, 24, {
                        isInView: isInView(layer),
                        layerDefaults,
                        interactive: false,
                        title: layer.title || layer.id
                    });

                    const $layerThumb = $('<div>', {
                        class: 'tree-node-preview-layer' + (isActive ? ' active' : ''),
                        title: layer.title || layer.id
                    });
                    $layerThumb.append(thumbnail);

                    // Hovering a thumbnail previews that layer's bbox / geojson on the map
                    $layerThumb.on('mouseenter', function () {
                        window.parent.postMessage({ type: 'layer-preview', layerId: layer.id }, '*');
                    }).on('mouseleave', function () {
                        window.parent.postMessage({ type: 'layer-clear-preview' }, '*');
                    });

                    // Clicks bubble up to the group header so the whole row expands the group
                    $layersContainer.append($layerThumb);
                });

                $preview.append($layersContainer);
            }

            return $preview;
        }

        // Count total layers in a node and its children
        function countLayers(node) {
            let count = node.layers.length;
            Object.values(node.children).forEach(child => {
                count += countLayers(child);
            });
            return count;
        }

        // Get tree node path for storing expand state
        function getTreeNodePath(atlasId, pathParts) {
            return `${atlasId}:${pathParts.join('/')}`;
        }

        // Check if tree node is expanded
        function isTreeNodeExpanded(atlasId, pathParts) {
            const nodePath = getTreeNodePath(atlasId, pathParts);
            const atlasExpanded = expandedTreeNodes.get(atlasId) || new Set();
            return atlasExpanded.has(nodePath);
        }

        // Toggle tree node expansion
        function toggleTreeNode(atlasId, pathParts) {
            if (!expandedTreeNodes.has(atlasId)) {
                expandedTreeNodes.set(atlasId, new Set());
            }
            const atlasExpanded = expandedTreeNodes.get(atlasId);
            const nodePath = getTreeNodePath(atlasId, pathParts);

            if (atlasExpanded.has(nodePath)) {
                atlasExpanded.delete(nodePath);
            } else {
                atlasExpanded.add(nodePath);
            }

            renderLayers();
        }

        // Render tree node recursively
        function renderTreeNode(atlasId, atlasData, node, pathParts = [], parentElement, searchTerm = '') {
            const nodePath = getTreeNodePath(atlasId, pathParts);
            let isExpanded = isTreeNodeExpanded(atlasId, pathParts);
            const hasActive = hasActiveDescendants(node);

            // Auto-expand if searching and node contains matching layers
            if (searchTerm && nodeContainsSearchMatch(node, searchTerm)) {
                isExpanded = true;
            }

            // Auto-expand when filtering by visibility so results are visible
            if (visibilityFilter !== 'all' && countLayers(node) > 0) {
                isExpanded = true;
            }

            const totalLayers = countLayers(node);

            const $treeNode = $('<div>', {
                class: 'tree-node' + (isExpanded ? ' expanded' : '')
            });

            // Node header
            const $header = $('<div>', {
                class: 'tree-node-header' + (hasActive ? ' has-active-children' : ''),
                click: function(e) {
                    e.stopPropagation();
                    toggleTreeNode(atlasId, pathParts);
                }
            });

            // Group visibility eye toggle (first column) - toggles all layers in this group
            const nodeLayers = collectNodeLayers(node);
            $header.attr('data-group-layers', nodeLayers.map(l => l.id).join(','));
            const $groupEye = createEyeToggle(groupEyeState(nodeLayers), function () {
                toggleGroupLayers(nodeLayers);
            });
            $header.append($groupEye);

            // Expand icon (only if has children or layers)
            const hasContent = Object.keys(node.children).length > 0 || node.layers.length > 0;
            if (hasContent) {
                const $expandIcon = $('<span>', {
                    class: 'tree-expand-icon',
                    text: '▶'
                });
                $header.append($expandIcon);
            } else {
                $header.append($('<span>', {
                    style: 'width: 12px; margin-right: 4px;'
                }));
            }

            // Header content container (label + preview)
            const $headerContent = $('<div>', {
                class: 'tree-node-header-content'
            });

            // Node label
            const $label = $('<span>', {
                class: 'tree-node-label',
                text: node.name
            });
            $headerContent.append($label);

            // Add collapsed preview inline if node is not expanded.
            // Preview clicks intentionally bubble to the header so clicking
            // anywhere on a collapsed group row (including thumbnails) expands it.
            if (!isExpanded && (Object.keys(node.children).length > 0 || node.layers.length > 0)) {
                const $preview = generateCollapsedPreview(atlasId, atlasData, node, pathParts);
                $headerContent.append($preview);
            }

            $header.append($headerContent);

            // Layer count badge (fixed on right)
            const mapWord = totalLayers === 1 ? 'Map' : 'Maps';
            const $count = $('<span>', {
                class: 'tree-node-count',
                text: `${totalLayers} ${mapWord}`
            });
            $header.append($count);

            $treeNode.append($header);

            // Children container
            const $children = $('<div>', {
                class: 'tree-node-children'
            });

            // Render child nodes (sorted alphabetically)
            const childNames = Object.keys(node.children).sort();
            childNames.forEach(childName => {
                const childNode = node.children[childName];
                const childPath = [...pathParts, childName];
                renderTreeNode(atlasId, atlasData, childNode, childPath, $children, searchTerm);
            });

            // Render layers at this level
            if (node.layers.length > 0) {
                const $leafItems = $('<div>', {
                    class: 'tree-leaf-items'
                });

                // If searching, separate matching and non-matching layers
                let matchingLayers = [];
                let nonMatchingLayers = [];

                if (searchTerm) {
                    node.layers.forEach(layer => {
                        if (matchesSearch(layer, searchTerm)) {
                            matchingLayers.push(layer);
                        } else {
                            nonMatchingLayers.push(layer);
                        }
                    });
                } else {
                    matchingLayers = [...node.layers];
                }

                // Sort matching layers by relevance score (desc), then alphabetically
                matchingLayers.sort((a, b) => {
                    if (searchTerm) {
                        const scoreDiff = getSearchScore(b, searchTerm) - getSearchScore(a, searchTerm);
                        if (scoreDiff !== 0) return scoreDiff;
                    }
                    const aName = (a.name || a.title || a.id || '').toLowerCase();
                    const bName = (b.name || b.title || b.id || '').toLowerCase();
                    return aName.localeCompare(bName);
                });

                // Sort non-matching layers alphabetically
                nonMatchingLayers.sort((a, b) => {
                    const aName = (a.name || a.title || a.id || '').toLowerCase();
                    const bName = (b.name || b.title || b.id || '').toLowerCase();
                    return aName.localeCompare(bName);
                });

                // Render matching layers first
                matchingLayers.forEach(layer => {
                    renderLayerItem(layer, atlasData, $leafItems, false);
                });

                // Add "[X more...]" section for non-matching layers if searching
                if (searchTerm && nonMatchingLayers.length > 0) {
                    const showMoreKey = `${nodePath}:showMore`;
                    const isShowingMore = showMoreNodes.get(showMoreKey) || false;

                    if (!isShowingMore) {
                        // Show collapsed "[X more...]" section
                        const $moreSection = $('<div>', {
                            class: 'atlas-collapsed-more',
                            style: 'cursor: pointer; padding: 8px; margin-top: 8px; background: #374151; border-radius: 4px; text-align: center; transition: background 0.2s;',
                            text: `[${nonMatchingLayers.length} more...]`,
                            click: function(e) {
                                e.stopPropagation();
                                showMoreNodes.set(showMoreKey, true);
                                renderLayers();
                            }
                        });
                        $moreSection.on('mouseenter', function() {
                            $(this).css('background', '#4b5563');
                        }).on('mouseleave', function() {
                            $(this).css('background', '#374151');
                        });
                        $leafItems.append($moreSection);
                    } else {
                        // Show all non-matching layers (dimmed)
                        nonMatchingLayers.forEach(layer => {
                            renderLayerItem(layer, atlasData, $leafItems, true);
                        });
                    }
                }

                $children.append($leafItems);
            }

            $treeNode.append($children);
            parentElement.append($treeNode);
        }

        // Render layer grid
        function renderLayerGrid(layers, searchTerm = '') {
            const $grid = $('#layer-grid');
            $grid.empty();

            if (layers.length === 0) {
                $grid.html('<div class="col-span-full text-center text-gray-400 py-12">No maps found</div>');
                return;
            }

            // Group layers by atlas using reference lists, so an atlas section
            // shows every layer it references — including ones whose definition
            // lives in another atlas (e.g. index references mapbox-streets).
            const layerById = new Map();
            allLayers.forEach(l => layerById.set(l.id, l));
            const filteredLayerIds = new Set(layers.map(l => l.id));

            const byAtlas = {};
            atlasMetadata.forEach((_, atlasId) => {
                const refs = atlasLayerReferences.get(atlasId) || [];
                const atlasLayersList = refs
                    .map(refId => layerById.get(refId))
                    .filter(l => l && filteredLayerIds.has(l.id));
                if (atlasLayersList.length > 0) {
                    byAtlas[atlasId] = atlasLayersList;
                }
            });

            // Catch any filtered layers not referenced by any atlas (orphans),
            // grouping them under their _sourceAtlas as a fallback.
            const placedIds = new Set();
            Object.values(byAtlas).forEach(arr => arr.forEach(l => placedIds.add(l.id)));
            layers.forEach(layer => {
                if (!placedIds.has(layer.id)) {
                    const atlasId = layer._sourceAtlas || 'unknown';
                    if (!byAtlas[atlasId]) byAtlas[atlasId] = [];
                    byAtlas[atlasId].push(layer);
                    placedIds.add(layer.id);
                }
            });

            // Get all atlas IDs
            const atlasIds = Object.keys(byAtlas);

            // Determine which atlases should be expanded based on search
            const atlasIdsWithResults = new Set(atlasIds);

            // Separate atlases into in-view and out-of-view
            const inViewAtlasIds = [];
            const outOfViewAtlasIds = [];

            atlasIds.forEach(atlasId => {
                const atlasLayers = byAtlas[atlasId];
                const hasInViewLayers = atlasLayers.some(layer => isInView(layer));

                if (hasInViewLayers) {
                    inViewAtlasIds.push(atlasId);
                } else {
                    outOfViewAtlasIds.push(atlasId);
                }
            });

            // Sort atlases by bbox size (ascending) - smaller/local first
            const sortAtlasesBySize = (a, b) => {
                const areaA = calculateAtlasBboxArea(a);
                const areaB = calculateAtlasBboxArea(b);

                if (areaA === Infinity && areaB === Infinity) return 0;
                if (areaA === Infinity) return 1;
                if (areaB === Infinity) return -1;

                return areaA - areaB;
            };

            // Sort in-view atlases by size (smallest first)
            inViewAtlasIds.sort(sortAtlasesBySize);

            // Sort out-of-view atlases by size and distance from current view
            outOfViewAtlasIds.sort((a, b) => {
                // First compare by size
                const sizeComparison = sortAtlasesBySize(a, b);
                if (sizeComparison !== 0) return sizeComparison;

                // If same size, compare by distance from current bounds
                const distA = calculateAtlasDistanceFromView(a);
                const distB = calculateAtlasDistanceFromView(b);
                return distA - distB;
            });

            // Extract index atlas if present (it should always be first)
            const indexAtlasInView = inViewAtlasIds.indexOf('index');
            const indexAtlasOutOfView = outOfViewAtlasIds.indexOf('index');

            let indexAtlasId = null;
            if (indexAtlasInView !== -1) {
                indexAtlasId = 'index';
                inViewAtlasIds.splice(indexAtlasInView, 1);
            } else if (indexAtlasOutOfView !== -1) {
                indexAtlasId = 'index';
                outOfViewAtlasIds.splice(indexAtlasOutOfView, 1);
            }

            // Combine: index first (if exists), then in-view, then out-of-view
            const orderedAtlasIds = indexAtlasId
                ? [indexAtlasId, ...inViewAtlasIds, ...outOfViewAtlasIds]
                : [...inViewAtlasIds, ...outOfViewAtlasIds];

            // Only expand first atlas on very first render (not set by user action)
            // Check if this is initial page load by seeing if expandedAtlasId was never set
            if (expandedAtlasId === null && orderedAtlasIds.length > 0 && !userCollapsedAll && typeof window.hasInitiallyExpanded === 'undefined') {
                expandedAtlasId = orderedAtlasIds[0];
                window.hasInitiallyExpanded = true;
            }

            // If a specific atlas is selected, ensure it's expanded ONLY on initial load (before user interaction)
            if (window.selectedAtlasId && orderedAtlasIds.includes(window.selectedAtlasId) && !userManuallyExpandedAtlas && !userHasInteractedWithAtlas) {
                expandedAtlasId = window.selectedAtlasId;
            }

            // Render index atlas first if it exists
            if (indexAtlasId && byAtlas[indexAtlasId]) {
                const atlasData = atlasMetadata.get(indexAtlasId) || {};
                const atlasLayers = byAtlas[indexAtlasId];
                renderAtlasCollapsed(indexAtlasId, atlasData, atlasLayers, $grid, searchTerm, atlasIdsWithResults);

                // Add separator after index atlas if there are other atlases
                if (inViewAtlasIds.length > 0 || outOfViewAtlasIds.length > 0) {
                    const $separator = $('<div>', {
                        style: 'margin: 8px 0; padding: 4px 12px; background: #111827; border-top: 1px solid #374151; border-bottom: 1px solid #374151;'
                    });
                    $grid.append($separator);
                }
            }

            // Render in-view atlas groups
            inViewAtlasIds.forEach(atlasId => {
                const atlasData = atlasMetadata.get(atlasId) || {};
                const atlasLayers = byAtlas[atlasId];
                renderAtlasCollapsed(atlasId, atlasData, atlasLayers, $grid, searchTerm, atlasIdsWithResults);
            });

            // Add separator between in-view and out-of-view if both exist
            if (inViewAtlasIds.length > 0 && outOfViewAtlasIds.length > 0) {
                const $separator = $('<div>', {
                    style: 'margin: 16px 0; padding: 8px 12px; background: #1f2937; border-radius: 4px; text-align: center; color: #9ca3af; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;',
                    text: 'Other Collections'
                });
                $grid.append($separator);
            }

            // Render out-of-view atlas groups
            outOfViewAtlasIds.forEach(atlasId => {
                const atlasData = atlasMetadata.get(atlasId) || {};
                const atlasLayers = byAtlas[atlasId];
                renderAtlasCollapsed(atlasId, atlasData, atlasLayers, $grid, searchTerm, atlasIdsWithResults);
            });
        }

        // Render atlas in collapsed view
        function renderAtlasCollapsed(atlasId, atlasData, atlasLayers, $grid, searchTerm = '', atlasIdsWithResults = new Set()) {
            // When searching or filtering by visibility, expand all atlases with results
            // Otherwise, use the single-expand behavior
            const expandAll = !!searchTerm || visibilityFilter !== 'all';
            const isExpanded = expandAll ? atlasIdsWithResults.has(atlasId) : expandedAtlasId === atlasId;

            // Auto-expand tree to show active layers only on initial atlas expansion
            // Check if this atlas has been auto-expanded before
            if (isExpanded && !expandAll && typeof window.atlasesAutoExpanded === 'undefined') {
                window.atlasesAutoExpanded = new Set();
            }
            if (isExpanded && !expandAll && !window.atlasesAutoExpanded.has(atlasId)) {
                autoExpandToActiveLayers(atlasId);
                window.atlasesAutoExpanded.add(atlasId);
            }

            // Check if atlas has active layers
            const hasActiveChildren = atlasLayers.some(layer => activeLayers.has(layer.id));

            const $collapsed = $('<div>', {
                class: 'atlas-collapsed',
                id: `atlas-${atlasId}`
            });

            const headerHasBg = !!atlasData.headerImage;
            const $header = $('<div>', {
                class: 'atlas-collapsed-header' + (hasActiveChildren ? ' has-active-children' : '') + (isExpanded ? ' expanded' : '') + (headerHasBg ? ' has-bg' : ''),
                style: 'cursor: pointer;' + (headerHasBg ? ` background-image: url("${atlasData.headerImage}");` : ''),
                click: function (e) {
                    // Don't toggle if clicking on links or buttons
                    if ($(e.target).closest('a, button').length) return;

                    // Mark that user has interacted with atlas
                    userHasInteractedWithAtlas = true;

                    // If currently searching, clear search and set this atlas as the only expanded one
                    if (searchTerm) {
                        $('#search-input').val('').trigger('input');
                        expandedAtlasId = atlasId;
                        userCollapsedAll = false;
                        userManuallyExpandedAtlas = (window.selectedAtlasId && atlasId !== window.selectedAtlasId);
                        return;
                    }

                    // Toggle expansion - only one atlas can be expanded at a time
                    if (expandedAtlasId === atlasId) {
                        // Clicking on expanded atlas collapses it
                        expandedAtlasId = null;
                        userCollapsedAll = true;
                        userManuallyExpandedAtlas = false;
                    } else {
                        // Clicking on collapsed atlas expands it (and collapses others)
                        expandedAtlasId = atlasId;
                        userCollapsedAll = false;
                        // Mark as manual expansion if it's different from the selected atlas
                        userManuallyExpandedAtlas = (window.selectedAtlasId && atlasId !== window.selectedAtlasId);
                    }
                    renderLayers();
                }
            });

            // Top row: holds the eye, expand icon, title and action buttons. The
            // expanded layout renders the full description on its own line below it.
            const $topRow = $('<div>', {
                class: 'atlas-header-top-row'
            });

            // Expand/collapse icon
            const $expandIcon = $('<span>', {
                class: 'atlas-expand-icon',
                text: isExpanded ? '▼' : '▶'
            });
            $topRow.append($expandIcon);

            // Atlas name and description container
            const $titleContainer = $('<div>', {
                style: 'flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden;'
            });

            // Atlas name badge
            const $nameBadge = $('<span>', {
                style: `background: ${atlasData.color || '#6b7280'}; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px;`
            });
            if (atlasData.icon) {
                $('<img>', {
                    src: atlasData.icon,
                    alt: '',
                    style: 'height: 14px; width: auto; display: block; flex-shrink: 0;'
                }).appendTo($nameBadge);
            }
            $('<span>', { text: atlasData.name || atlasId }).appendTo($nameBadge);
            $titleContainer.append($nameBadge);

            // Atlas-level tags (if available)
            if (atlasData.tags && Array.isArray(atlasData.tags) && atlasData.tags.length > 0) {
                atlasData.tags.forEach(tag => {
                    const $tagBadge = $('<span>', {
                        style: 'background: #374151; color: #d1d5db; padding: 3px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; letter-spacing: 0.5px;',
                        text: tag
                    });
                    $titleContainer.append($tagBadge);
                });
            }

            // Atlas description — inline & truncated when collapsed. When expanded
            // the full description is rendered on its own line below the top row.
            if (atlasData.description && !isExpanded) {
                const $description = $('<span>', {
