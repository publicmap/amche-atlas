<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Inspector</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/themes/light.css" />
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/shoelace-autoloader.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #111827;
        }

        .layer-card {
            transition: all 0.2s ease;
            cursor: pointer;
            border-left: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .layer-card:hover {
            transform: translateX(2px);
        }

        .layer-card.highlighted {
            border-left-color: #3b82f6;
            background-color: #1e3a5f;
        }

        .layer-card.expanded {
            border-left-color: #3b82f6;
        }

        .layer-card.dimmed {
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .layer-card.dimmed:hover {
            opacity: 0.9;
        }

        .layer-card-compact {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            min-height: 56px;
        }

        .layer-card-expanded {
            display: none;
            padding: 12px;
            background: #1f2937;
        }

        .layer-card.expanded .layer-card-expanded {
            display: block;
        }

        .layer-header-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.15;
            background-size: cover;
            background-position: center;
            pointer-events: none;
        }

        .layer-content {
            position: relative;
            z-index: 1;
        }

        .atlas-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }

        .info-button {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #374151;
            color: white;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .info-button:hover {
            background: #4b5563;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #374151;
        }

        .action-button {
            flex: 1;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #ffbf00;
            background: #ffbf00;
            color: #000;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .action-button:hover {
            background: #ffd700;
            border-color: #ffd700;
        }

        .opacity-slider {
            width: 100%;
            margin: 8px 0;
        }

        .feature-info {
            background: #1f2937;
            border-radius: 4px;
            padding: 8px;
            margin-top: 8px;
        }

        .feature-custom-info {
            background: #1f2937;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #3b82f6;
        }

        .feature-custom-info strong {
            color: #e5e7eb;
        }

        .feature-custom-info a {
            color: #60a5fa;
            text-decoration: none;
        }

        .feature-custom-info a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .property-row {
            display: flex;
            font-size: 11px;
            padding: 2px 0;
            border-bottom: 1px solid #374151;
        }

        .property-row:last-child {
            border-bottom: none;
        }

        .property-key {
            color: #9ca3af;
            min-width: 100px;
            font-weight: 500;
        }

        .property-value {
            color: #e5e7eb;
            flex: 1;
            word-break: break-word;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        .toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
            background: #4b5563;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle-switch.active {
            background: #3b82f6;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle-switch.active::after {
            transform: translateX(16px);
        }

        .section-header {
            transition: background 0.2s;
        }

        .section-header:hover {
            background: #4b5563 !important;
        }

        .section-header .toggle-icon {
            display: inline-block;
            transition: transform 0.2s;
        }

        #status-bar {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-white" style="display: flex; flex-direction: column;">
    <!-- Header -->
    <div class="header" style="flex-shrink: 0; background: #1f2937; padding: 12px; border-bottom: 1px solid #374151;">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div id="drag-handle" class="text-sm font-semibold flex items-center gap-2"
                    style="user-select: none; cursor: move; padding: 4px 8px; margin: -4px -8px; color: #ffbf00;">
                    <sl-icon name="layers" style="font-size: 16px;"></sl-icon>
                    <span>Map Layers</span>
                </div>
                <sl-dropdown distance="5" placement="bottom-start" id="options-dropdown">
                    <button slot="trigger" class="text-xs"
                        style="background: transparent; border: none; color: rgba(235, 235, 235, 0.7); cursor: pointer; padding: 4px 8px;">
                        Options
                    </button>
                    <sl-menu>
                        <sl-menu-item id="isolate-menu-item">
                            <sl-switch size="small" checked style="pointer-events: none;"
                                id="isolate-switch"></sl-switch>
                            <span style="margin-left: 8px;">Isolate layers on click</span>
                        </sl-menu-item>
                        <sl-menu-item id="popups-menu-item">
                            <sl-switch size="small" style="pointer-events: none;" id="popups-switch"></sl-switch>
                            <span style="margin-left: 8px;">Show feature popups</span>
                        </sl-menu-item>
                    </sl-menu>
                </sl-dropdown>
            </div>
            <button id="close-button" class="text-white"
                style="background: transparent; border: none; cursor: pointer; padding: 4px; opacity: 0.7; font-size: 20px; line-height: 1;"
                title="Close panel">×</button>
        </div>
    </div>

    <!-- Main Content (Layer List) -->
    <div id="layer-container"
        style="flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">

        <!-- Selected Features Section -->
        <div id="selected-features-section" style="display: none; flex-shrink: 0; background: #111827; padding: 8px 4px 0 4px;">
            <div class="section-header"
                style="padding: 8px 12px; background: #3b82f6; border-radius: 4px; user-select: none; display: flex; align-items: center; justify-content: space-between;">
                <span class="text-xs font-semibold text-white flex items-center gap-2">
                    <sl-icon name="check-circle-fill" style="font-size: 14px;"></sl-icon>
                    LAYERS WITH SELECTION <span id="selected-count" class="text-blue-200">(0)</span>
                </span>
            </div>
            <div id="selected-features-list" class="scrollbar-thin"
                style="overflow-y: auto; padding: 4px; max-height: 400px;"></div>
        </div>

        <!-- Overlay Maps Section -->
        <div style="flex-shrink: 0; background: #111827; padding: 8px 4px 0 4px;">
            <div class="section-header" id="overlay-header"
                style="padding: 8px 12px; background: #374151; border-radius: 4px; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between;">
                <span class="text-xs font-semibold text-gray-300 flex items-center gap-2">
                    <sl-icon name="layers-half" style="font-size: 14px;"></sl-icon>
                    OVERLAY MAPS <span id="overlay-count" class="text-gray-400">(0)</span>
                </span>
                <span class="toggle-icon" style="font-size: 12px; transition: transform 0.2s;">▼</span>
            </div>
        </div>

        <!-- Overlay List (Scrollable) -->
        <div id="overlay-list" class="scrollbar-thin"
            style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px;"></div>

        <!-- Base Maps Section -->
        <div style="flex-shrink: 0; background: #111827; padding: 0 4px 8px 4px; margin-top:6px">
            <div class="section-header" id="basemap-header"
                style="padding: 8px 12px; background: #374151; border-radius: 4px; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
                <span class="text-xs font-semibold text-gray-300 flex items-center gap-2">
                    <sl-icon name="stack" style="font-size: 14px;"></sl-icon>
                    BASE MAPS <span id="basemap-count" class="text-gray-400">(0)</span>
                </span>
                <span class="toggle-icon"
                    style="font-size: 12px; transition: transform 0.2s; transform: rotate(-90deg);">▼</span>
            </div>
            <div id="basemap-list" class="scrollbar-thin"
                style="display: none; overflow-y: auto; padding: 0 4px;"></div>
        </div>
    </div>

    <!-- Footer (Status Bar) -->
    <div id="status-bar"
        style="display: none; flex-shrink: 0; height: 44px; background: #111827; border-top: 1px solid #374151; padding: 0 12px; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <sl-icon name="check-circle-fill" style="color: #10b981; font-size: 16px;"></sl-icon>
            <span id="status-text" style="font-size: 11px; color: #d1d5db;"></span>
        </div>
        <button id="clear-selection-btn"
            style="padding: 6px 12px; background: #374151; color: white; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; transition: background 0.2s;">
            Clear Selection
        </button>
    </div>

    <script type="module">
        import { LayerThumbnail } from './js/layer-thumbnail.js';

        // State
        let activeLayers = [];
        let layerRegistry = null;
        let expandedLayerId = null;
        let isolateEnabled = true;
        let showPopups = false;
        let highlightedLayerIds = new Set();
        let selectedFeatures = new Map();
        let featureCustomHTML = new Map(); // layerId -> custom HTML

        // Make LayerThumbnail available globally
        window.LayerThumbnail = LayerThumbnail;

        // Initialize
        $(document).ready(function () {
            setupEventListeners();
            requestLayerData();
        });

        // Request layer data from parent
        function requestLayerData() {
            window.parent.postMessage({
                type: 'request-inspector-data'
            }, '*');
        }

        // Notify parent about height changes
        function notifyHeightChange() {
            const overlayOpen = $('#overlay-list').is(':visible');
            const basemapOpen = $('#basemap-list').is(':visible');
            const overlayCount = $('#overlay-list').children('.layer-card').length;
            const basemapCount = $('#basemap-list').children('.layer-card').length;

            const overlayHeight = overlayOpen ? $('#overlay-list')[0].scrollHeight : 0;
            const basemapHeight = basemapOpen ? $('#basemap-list')[0].scrollHeight : 0;
            const statusBarVisible = $('#status-bar').is(':visible');

            window.parent.postMessage({
                type: 'inspector-height-change',
                overlayOpen: overlayOpen,
                basemapOpen: basemapOpen,
                overlayCount: overlayCount,
                basemapCount: basemapCount,
                overlayHeight: overlayHeight,
                basemapHeight: basemapHeight,
                statusBarVisible: statusBarVisible
            }, '*');
        }

        // Setup message listener for parent communication
        window.addEventListener('message', function (event) {
            if (event.data.type === 'inspector-data') {
                activeLayers = event.data.activeLayers || [];
                layerRegistry = event.data.layerRegistry;
                renderLayers();
                reapplyVisualIsolationIfNeeded();
            }

            if (event.data.type === 'active-layers-update') {
                activeLayers = event.data.activeLayers || [];
                renderLayers();
                reapplyVisualIsolationIfNeeded();
            }

            if (event.data.type === 'highlight-layers') {
                highlightedLayerIds = new Set(event.data.layerIds || []);
                updateHighlights();
            }

            if (event.data.type === 'clear-highlights') {
                highlightedLayerIds.clear();
                updateHighlights();
            }

            if (event.data.type === 'feature-selected') {
                const layerId = event.data.layerId;
                const feature = event.data.feature;

                console.log('[Inspector] Feature selected:', layerId, feature);
                selectedFeatures.set(layerId, feature);

                if (expandedLayerId !== layerId) {
                    expandedLayerId = layerId;
                }

                renderLayers();
                reapplyVisualIsolationIfNeeded();
                updateStatusBar();
            }

            if (event.data.type === 'feature-inspection-data') {
                const layerId = event.data.layerId;
                const customHTML = event.data.customHTML;

                console.log('[Inspector] Inspection data received:', layerId, customHTML ? 'HTML present' : 'No HTML');

                // Store custom HTML for this layer
                featureCustomHTML.set(layerId, customHTML);

                // Re-render to show custom HTML
                renderLayers();
            }

            if (event.data.type === 'request-height-update') {
                notifyHeightChange();
            }

            if (event.data.type === 'selection-cleared') {
                const layerId = event.data.layerId;
                selectedFeatures.delete(layerId);
                featureCustomHTML.delete(layerId); // Clear custom HTML
                if (expandedLayerId === layerId) {
                    expandedLayerId = null;
                    if (isolateEnabled) {
                        window.parent.postMessage({
                            type: 'clear-layer-isolation'
                        }, '*');
                    }
                }
                renderLayers();
                clearVisualIsolation();
                updateStatusBar();
            }
        });

        // Setup UI event listeners
        function setupEventListeners() {
            // Options menu items
            $('#isolate-menu-item').on('click', function (e) {
                e.stopPropagation();
                const $switch = $('#isolate-switch');
                isolateEnabled = !isolateEnabled;
                $switch.prop('checked', isolateEnabled);

                // Clear isolation if disabling
                if (!isolateEnabled && expandedLayerId) {
                    window.parent.postMessage({
                        type: 'clear-layer-isolation'
                    }, '*');
                    clearVisualIsolation();
                }
            });

            $('#popups-menu-item').on('click', function (e) {
                e.stopPropagation();
                const $switch = $('#popups-switch');
                showPopups = !showPopups;
                $switch.prop('checked', showPopups);

                // Notify parent about popup preference change
                window.parent.postMessage({
                    type: 'toggle-popups',
                    enabled: showPopups
                }, '*');
            });

            // Close button
            $('#close-button').on('click', function () {
                window.parent.postMessage({
                    type: 'close-panel'
                }, '*');
            });

            $('#close-button').on('mouseenter', function () {
                $(this).css('opacity', '1');
            });

            $('#close-button').on('mouseleave', function () {
                $(this).css('opacity', '0.7');
            });



            $('#basemap-header').on('click', function () {
                const $basemapList = $('#basemap-list');
                const $basemapIcon = $(this).find('.toggle-icon');
                const $overlayList = $('#overlay-list');
                const $overlayIcon = $('#overlay-header').find('.toggle-icon');

                // If basemap list is currently hidden, show it and hide overlay list
                if (!$basemapList.is(':visible')) {
                    $overlayList.slideUp(200);
                    $overlayIcon.css('transform', 'rotate(-90deg)');
                    $basemapList.slideDown(200);
                    $basemapIcon.css('transform', 'rotate(0deg)');
                } else {
                    // Otherwise just toggle basemap list
                    $basemapList.slideToggle(200);
                    $basemapIcon.css('transform', $basemapList.is(':visible') ? 'rotate(0deg)' : 'rotate(-90deg)');
                }

                // Notify after animation completes
                setTimeout(notifyHeightChange, 250);
            });

            $('#clear-selection-btn').on('click', function () {
                clearAllSelections();
            });

            $('#clear-selection-btn').on('mouseenter', function () {
                $(this).css('background', '#4b5563');
            });

            $('#clear-selection-btn').on('mouseleave', function () {
                $(this).css('background', '#374151');
            });

            $('#overlay-header').on('click', function () {
                const $overlayList = $('#overlay-list');
                const $overlayIcon = $(this).find('.toggle-icon');
                const $basemapList = $('#basemap-list');
                const $basemapIcon = $('#basemap-header').find('.toggle-icon');

                // If overlay list is currently hidden, show it and hide basemap list
                if (!$overlayList.is(':visible')) {
                    $basemapList.slideUp(200);
                    $basemapIcon.css('transform', 'rotate(-90deg)');
                    $overlayList.slideDown(200);
                    $overlayIcon.css('transform', 'rotate(0deg)');
                } else {
                    // Otherwise just toggle overlay list
                    $overlayList.slideToggle(200);
                    $overlayIcon.css('transform', $overlayList.is(':visible') ? 'rotate(0deg)' : 'rotate(-90deg)');
                }

                // Notify after animation completes
                setTimeout(notifyHeightChange, 250);
            });

            // Mouse leave handler - clear isolation when mouse leaves panel
            $(document.body).on('mouseleave', function () {
                if (expandedLayerId) {
                    expandedLayerId = null;
                    if (isolateEnabled) {
                        window.parent.postMessage({
                            type: 'clear-layer-isolation'
                        }, '*');
                    }
                    renderLayers();
                    clearVisualIsolation();
                }
            });
        }

        // Render all active layers
        function renderLayers() {
            const $overlayList = $('#overlay-list');
            const $basemapList = $('#basemap-list');
            const $selectedList = $('#selected-features-list');
            const $selectedSection = $('#selected-features-section');

            $overlayList.empty();
            $basemapList.empty();
            $selectedList.empty();

            if (activeLayers.length === 0) {
                $overlayList.html('<div class="text-center text-gray-500 py-4 text-xs">No overlay maps</div>');
                $basemapList.html('<div class="text-center text-gray-500 py-4 text-xs">No base maps</div>');
                $('#overlay-count').text('(0)');
                $('#basemap-count').text('(0)');
                $selectedSection.hide();
                return;
            }

            const overlayMaps = [];
            const baseMaps = [];
            const selectedLayers = [];

            activeLayers.forEach(layerConfig => {
                const hasSelection = selectedFeatures.has(layerConfig.id);
                const isBasemap = layerConfig.tags && Array.isArray(layerConfig.tags) &&
                    layerConfig.tags.includes('basemap');

                if (hasSelection) {
                    selectedLayers.push(layerConfig);
                }

                if (isBasemap) {
                    baseMaps.push(layerConfig);
                } else {
                    overlayMaps.push(layerConfig);
                }
            });

            // Render selected features section
            if (selectedLayers.length > 0) {
                $selectedSection.show();
                $('#selected-count').text(`(${selectedLayers.length})`);

                selectedLayers.forEach(layerConfig => {
                    const $card = createSelectedFeatureCard(layerConfig);
                    $selectedList.append($card);
                });
            } else {
                $selectedSection.hide();
            }

            // Update counts
            $('#overlay-count').text(`(${overlayMaps.length})`);
            $('#basemap-count').text(`(${baseMaps.length})`);

            if (overlayMaps.length === 0) {
                $overlayList.html('<div class="text-center text-gray-500 py-4 text-xs">No overlay maps</div>');
            } else {
                overlayMaps.forEach(layerConfig => {
                    const $card = createLayerCard(layerConfig);
                    $overlayList.append($card);
                });
            }

            if (baseMaps.length === 0) {
                $basemapList.html('<div class="text-center text-gray-500 py-4 text-xs">No base maps</div>');
            } else {
                baseMaps.forEach(layerConfig => {
                    const $card = createLayerCard(layerConfig);
                    $basemapList.append($card);
                });
            }

            // Notify parent about potential height change
            setTimeout(notifyHeightChange, 100);
        }

        // Create selected feature card (always expanded, with hover isolation)
        function createSelectedFeatureCard(layerConfig) {
            const atlasMetadata = layerRegistry?._atlasMetadata?.get(layerConfig._sourceAtlas) || {};
            const selectedFeature = selectedFeatures.get(layerConfig.id);

            if (!selectedFeature) {
                return $('<div>'); // Return empty div if no feature
            }

            const $card = $('<div>', {
                class: 'layer-card bg-gray-800 rounded mb-2 border-l-4',
                'data-layer-id': layerConfig.id,
                css: {
                    borderLeftColor: '#10b981',
                    cursor: 'default'
                }
            });

            // Header background
            if (layerConfig.headerImage) {
                const $bg = $('<div>', { class: 'layer-header-bg' });
                $bg.css('background-image', `url('${layerConfig.headerImage}')`);
                $card.append($bg);
            }

            // Header (non-clickable)
            const $header = $('<div>', {
                class: 'layer-content',
                css: {
                    padding: '8px 12px',
                    borderBottom: '1px solid #374151'
                }
            });

            const $headerRow = $('<div>', { class: 'flex items-center gap-2' });

            // Atlas badge
            if (atlasMetadata.name) {
                const $badge = $('<span>', {
                    class: 'atlas-badge',
                    text: atlasMetadata.name,
                    css: {
                        backgroundColor: atlasMetadata.color || '#2563eb'
                    }
                });
                $headerRow.append($badge);
            }

            // Layer name
            const $name = $('<span>', {
                class: 'text-sm font-medium text-white',
                text: layerConfig.title || layerConfig.id
            });
            $headerRow.append($name);

            // Info button
            const $infoBtn = $('<button>', {
                class: 'info-button',
                html: 'i',
                title: 'Layer information',
                click: function (e) {
                    e.stopPropagation();
                    openLayerInfo(layerConfig);
                }
            });
            $headerRow.append($infoBtn);

            $header.append($headerRow);
            $card.append($header);

            // Feature content (always expanded)
            const $content = $('<div>', {
                class: 'layer-content',
                css: {
                    padding: '12px'
                }
            });

            // Show custom HTML if available (from inspection handler)
            const customHTML = featureCustomHTML.get(layerConfig.id);
            if (customHTML) {
                const $customSection = $('<div>', {
                    class: 'feature-custom-info',
                    html: customHTML
                });
                $content.append($customSection);
            }

            // Show standard feature properties
            const $featureInfo = $('<div>', { class: 'feature-info' });
            const $title = $('<div>', {
                class: 'text-xs font-semibold text-gray-300 mb-2',
                text: 'Feature Properties'
            });
            $featureInfo.append($title);

            if (selectedFeature.properties) {
                const $props = $('<div>');
                Object.entries(selectedFeature.properties).forEach(([key, value]) => {
                    if (value !== null && value !== undefined && value !== '') {
                        const $row = $('<div>', { class: 'property-row' });
                        $row.append($('<div>', { class: 'property-key', text: key }));
                        $row.append($('<div>', { class: 'property-value', text: String(value) }));
                        $props.append($row);
                    }
                });
                $featureInfo.append($props);
            }
            $content.append($featureInfo);
            $card.append($content);

            // Add hover handlers for map isolation
            $card.on('mouseenter', function () {
                // Get feature ID for state management
                const featureId = selectedFeature.id || selectedFeature.properties?.id;

                // Notify parent to isolate this feature on the map
                window.parent.postMessage({
                    type: 'hover-isolate-feature',
                    layerId: layerConfig.id,
                    featureId: featureId,
                    feature: selectedFeature
                }, '*');
            });

            $card.on('mouseleave', function () {
                // Notify parent to clear feature isolation
                window.parent.postMessage({
                    type: 'clear-feature-isolation',
                    layerId: layerConfig.id
                }, '*');
            });

            return $card;
        }

        // Create layer card
        function createLayerCard(layer) {
            const atlasMetadata = layerRegistry?._atlasMetadata?.get(layer._sourceAtlas) || {};
            const isExpanded = expandedLayerId === layer.id;
            const isHighlighted = highlightedLayerIds.has(layer.id);

            const $card = $('<div>', {
                class: 'layer-card bg-gray-800 rounded mb-2' +
                    (isExpanded ? ' expanded' : '') +
                    (isHighlighted ? ' highlighted' : ''),
                'data-layer-id': layer.id
            });

            // Header background
            if (layer.headerImage) {
                const $bg = $('<div>', { class: 'layer-header-bg' });
                $bg.css('background-image', `url('${layer.headerImage}')`);
                $card.append($bg);
            }

            // Compact view
            const $compact = $('<div>', { class: 'layer-card-compact layer-content' });

            // Thumbnail
            const thumbnail = window.LayerThumbnail.generate(layer, 40);
            thumbnail.style.margin = '0';
            thumbnail.style.borderRadius = '4px';
            $compact.append(thumbnail);

            // Info section
            const $info = $('<div>', { class: 'flex-1 min-w-0' });

            // Atlas badge and layer name
            const $header = $('<div>', { class: 'flex items-center gap-2' });
            if (atlasMetadata.name) {
                const $badge = $('<span>', {
                    class: 'atlas-badge',
                    text: atlasMetadata.name,
                    css: {
                        backgroundColor: atlasMetadata.color || '#2563eb'
                    }
                });
                $header.append($badge);
            }

            const $name = $('<span>', {
                class: 'text-sm font-medium text-white truncate flex-1',
                text: layer.title || layer.id
            });
            $header.append($name);

            if (isExpanded) {
                const $infoBtn = $('<button>', {
                    class: 'info-button',
                    html: 'i',
                    title: 'Layer information',
                    click: function (e) {
                        e.stopPropagation();
                        openLayerInfo(layer);
                    }
                });
                $header.append($infoBtn);
            }

            $info.append($header);
            $compact.append($info);
            $card.append($compact);

            // Expanded view
            if (isExpanded) {
                const $expanded = $('<div>', { class: 'layer-card-expanded layer-content' });

                // Show feature details if selected, otherwise show description
                const selectedFeature = selectedFeatures.get(layer.id);
                if (selectedFeature) {
                    // Show custom HTML if available (from inspection handler)
                    const customHTML = featureCustomHTML.get(layer.id);
                    if (customHTML) {
                        const $customSection = $('<div>', {
                            class: 'feature-custom-info',
                            html: customHTML
                        });
                        $expanded.append($customSection);
                    }

                    // Show standard feature properties
                    const $featureInfo = $('<div>', { class: 'feature-info' });
                    const $title = $('<div>', {
                        class: 'text-xs font-semibold text-gray-300 mb-2',
                        text: 'Selected Feature'
                    });
                    $featureInfo.append($title);

                    if (selectedFeature.properties) {
                        const $props = $('<div>');
                        Object.entries(selectedFeature.properties).forEach(([key, value]) => {
                            if (value !== null && value !== undefined && value !== '') {
                                const $row = $('<div>', { class: 'property-row' });
                                $row.append($('<div>', { class: 'property-key', text: key }));
                                $row.append($('<div>', { class: 'property-value', text: String(value) }));
                                $props.append($row);
                            }
                        });
                        $featureInfo.append($props);
                    }
                    $expanded.append($featureInfo);
                } else {
                    // Description
                    if (layer.description) {
                        const $desc = $('<div>', {
                            class: 'text-xs text-gray-300 mb-3',
                            html: layer.description
                        });
                        $expanded.append($desc);
                    }
                }

                // Action buttons
                const $actions = $('<div>', { class: 'action-buttons' });

                // Opacity control
                const $opacityContainer = $('<div>', { class: 'flex-1' });
                const $opacityLabel = $('<div>', {
                    class: 'text-xs text-gray-400 mb-1',
                    text: 'Opacity'
                });
                const currentOpacity = layer.opacity !== undefined ? layer.opacity : 0.9;
                const $opacitySlider = $('<input>', {
                    type: 'range',
                    class: 'opacity-slider',
                    min: 0,
                    max: 100,
                    value: Math.round(currentOpacity * 100),
                    css: {
                        width: '100%',
                        accentColor: '#3b82f6'
                    }
                });
                $opacitySlider.on('input', function () {
                    const opacity = $(this).val() / 100;
                    window.parent.postMessage({
                        type: 'update-layer-opacity',
                        layerId: layer.id,
                        opacity: opacity
                    }, '*');
                });
                $opacityContainer.append($opacityLabel);
                $opacityContainer.append($opacitySlider);
                $actions.append($opacityContainer);

                $expanded.append($actions);

                // Button row
                const $buttonRow = $('<div>', {
                    class: 'flex gap-2 mt-2'
                });

                // Zoom button (if layer has bbox)
                if (layer.bbox || atlasMetadata.bbox) {
                    const $zoomBtn = $('<button>', {
                        class: 'action-button',
                        html: '🔍 Zoom',
                        click: function (e) {
                            e.stopPropagation();
                            window.parent.postMessage({
                                type: 'zoom-to-layer',
                                layerId: layer.id
                            }, '*');
                        }
                    });
                    $buttonRow.append($zoomBtn);
                }

                // Delete button
                const $deleteBtn = $('<button>', {
                    class: 'action-button',
                    html: '🗑️ Remove',
                    css: { color: '#ef4444' },
                    click: function (e) {
                        e.stopPropagation();
                        window.parent.postMessage({
                            type: 'remove-layer',
                            layerId: layer.id
                        }, '*');
                    }
                });
                $buttonRow.append($deleteBtn);

                $expanded.append($buttonRow);
                $card.append($expanded);
            }

            // Click handler
            $card.on('click', function (e) {
                if (!$(e.target).closest('.info-button, .action-button, input').length) {
                    toggleLayerExpanded(layer.id);
                }
            });

            return $card;
        }

        // Toggle layer expanded state
        function toggleLayerExpanded(layerId) {
            if (expandedLayerId === layerId) {
                expandedLayerId = null;
                if (isolateEnabled) {
                    window.parent.postMessage({
                        type: 'clear-layer-isolation'
                    }, '*');
                }
                renderLayers();
                clearVisualIsolation();
            } else {
                expandedLayerId = layerId;
                renderLayers();
                if (isolateEnabled) {
                    const layer = activeLayers.find(l => l.id === layerId);
                    const isBasemap = layer && layer.tags && Array.isArray(layer.tags) && layer.tags.includes('basemap');

                    window.parent.postMessage({
                        type: 'isolate-layer',
                        layerId: layerId,
                        isBasemap: isBasemap
                    }, '*');
                    setTimeout(() => applyVisualIsolation(layerId, isBasemap), 10);
                }
            }
            setTimeout(notifyHeightChange, 50);
        }

        function applyVisualIsolation(isolatedLayerId, isBasemap) {
            const targetList = isBasemap ? $('#basemap-list') : $('#overlay-list');

            targetList.find('.layer-card').each(function () {
                const layerId = $(this).data('layer-id');
                if (layerId !== isolatedLayerId) {
                    $(this).addClass('dimmed');
                } else {
                    $(this).removeClass('dimmed');
                }
            });
        }

        function clearVisualIsolation() {
            $('.layer-card').removeClass('dimmed');
        }

        function reapplyVisualIsolationIfNeeded() {
            if (isolateEnabled && expandedLayerId) {
                const layer = activeLayers.find(l => l.id === expandedLayerId);
                if (layer) {
                    const isBasemap = layer.tags && Array.isArray(layer.tags) && layer.tags.includes('basemap');
                    setTimeout(() => applyVisualIsolation(expandedLayerId, isBasemap), 10);
                }
            }
        }

        // Update highlight states
        function updateHighlights() {
            $('.layer-card').each(function () {
                const layerId = $(this).data('layer-id');
                $(this).toggleClass('highlighted', highlightedLayerIds.has(layerId));
            });
        }

        // Update status bar
        function updateStatusBar() {
            const $statusBar = $('#status-bar');
            const $statusText = $('#status-text');

            if (selectedFeatures.size === 0) {
                $statusBar.hide();
                return;
            }

            const featureCount = selectedFeatures.size;
            const layerCount = selectedFeatures.size;
            $statusText.text(`${featureCount} feature${featureCount !== 1 ? 's' : ''} selected`);
            $statusBar.css('display', 'flex');
        }

        // Clear all selections
        function clearAllSelections() {
            selectedFeatures.clear();
            expandedLayerId = null;
            if (isolateEnabled) {
                window.parent.postMessage({
                    type: 'clear-layer-isolation'
                }, '*');
            }
            renderLayers();
            clearVisualIsolation();
            updateStatusBar();

            window.parent.postMessage({
                type: 'clear-all-selections'
            }, '*');
        }

        // Open layer information modal in parent
        function openLayerInfo(layer) {
            window.parent.postMessage({
                type: 'open-layer-info',
                layer: layer
            }, '*');
        }
    </script>
</body>

</html>
