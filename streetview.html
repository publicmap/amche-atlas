<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street View</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #111827;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        #streetview-header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 8px;
            border-bottom: 1px solid #374151;
            background: #0b1220;
        }
        #streetview-header a {
            font-size: 10px;
            font-weight: 600;
            color: #9ca3af;
            text-decoration: none;
            letter-spacing: 0.06em;
        }
        #streetview-header a:hover {
            color: #e5e7eb;
        }
        #streetview-header label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #d1d5db;
            cursor: pointer;
        }
        #streetview-header input[type="checkbox"] {
            margin: 0;
            cursor: pointer;
        }
        #streetview-viewer {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        @keyframes sv-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="streetview-header">
        <span style="font-size: 12px;">📷</span>
        <a href="https://www.mapillary.com/" target="_blank">Mapillary</a>
        <label>
            <input type="checkbox" id="streetview-follow" checked>
            Follow
        </label>
        <label>
            <input type="checkbox" id="streetview-perspective" checked>
            Perspective View
        </label>
        <label>
            <input type="checkbox" id="streetview-pin-location" checked>
            Pin Location
        </label>
    </div>
    <div id="streetview-viewer"></div>
    <script type="module" src="./js/streetview-viewer.js"></script>
</body>
</html>
