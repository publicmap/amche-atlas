<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self' 'unsafe-inline' 'unsafe-eval';
  media-src https://storage.googleapis.com blob: data:;
  img-src https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org data: blob: *;
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net blob:;
  style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  worker-src 'self' blob:;
  connect-src *;
">
<title>Earth Engine Timelapse</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mapbox-gl@3.23.0-rc.1/dist/mapbox-gl.css"/>
<script src="https://cdn.jsdelivr.net/npm/mapbox-gl@3.23.0-rc.1/dist/mapbox-gl.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0d12;
    font-family: 'Courier New', monospace;
    color: #c8e6c9;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #header {
    padding: 10px 18px;
    background: rgba(0,0,0,0.7);
    border-bottom: 1px solid #1b5e20;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 1000;
    flex-shrink: 0;
  }

  #header h1 {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #69f0ae;
    font-weight: normal;
  }

  #year-display {
    font-size: 22px;
    font-weight: bold;
    color: #69f0ae;
    letter-spacing: 2px;
    min-width: 50px;
  }

  #map {
    flex: 1;
    width: 100%;
    background: #0a0d12;
  }

  /* Mapbox attribution tweak */
  .mapboxgl-ctrl-attrib {
    background: rgba(0,0,0,0.6) !important;
    color: #4caf50 !important;
    font-size: 9px !important;
  }
  .mapboxgl-ctrl-attrib a { color: #69f0ae !important; }
  .mapboxgl-ctrl-attrib-inner { color: #4caf50 !important; }

  #controls {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(0,0,0,0.82);
    border: 1px solid #1b5e20;
    border-radius: 4px;
    padding: 12px 22px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: 480px;
    backdrop-filter: blur(8px);
  }

  #year-big {
    font-size: 32px;
    font-weight: bold;
    color: #69f0ae;
    letter-spacing: 6px;
    text-shadow: 0 0 14px #69f0ae66;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  /* Scrubber on its own row so the thumb sits on a clean horizontal axis. */
  #scrubber-row {
    width: 100%;
    display: flex;
    align-items: center;
    padding: 4px 2px 0;
  }

  #scrubber {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 16px;
    background: transparent;
    outline: none;
    cursor: pointer;
    padding: 0;
    margin: 0;
  }
  #scrubber::-webkit-slider-runnable-track {
    height: 4px;
    background: #1b5e20;
    border-radius: 2px;
    background-image: repeating-linear-gradient(
      to right,
      #1b5e20 0, #1b5e20 calc(100% / 38 - 1px),
      #388e3c calc(100% / 38 - 1px), #388e3c calc(100% / 38)
    );
  }
  #scrubber::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #69f0ae;
    cursor: pointer;
    box-shadow: 0 0 8px #69f0aeaa;
    border: 2px solid #0a0d12;
    margin-top: -6px;
  }
  #scrubber::-moz-range-track {
    height: 4px;
    background: #1b5e20;
    border-radius: 2px;
  }
  #scrubber::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #69f0ae;
    border: 2px solid #0a0d12;
    cursor: pointer;
    box-shadow: 0 0 8px #69f0aeaa;
  }

  /* Player controls row — separate from scrubber. */
  #player-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
  }

  .timeline-btn {
    background: none;
    border: 1px solid #388e3c;
    color: #69f0ae;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: background 0.15s;
    min-width: 32px;
  }
  .timeline-btn:hover:not(:disabled) { background: #1b5e2044; }
  .timeline-btn:disabled { opacity: 0.35; cursor: default; }

  #btn-play { min-width: 72px; }

  .year-labels {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 9px;
    color: #388e3c;
    letter-spacing: 1px;
    padding: 0 2px;
    font-variant-numeric: tabular-nums;
  }

  #speed-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: #4caf50;
    letter-spacing: 1px;
    margin-left: 14px;
  }

  #speed {
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    width: 90px;
    background: #1b5e20;
    outline: none;
    cursor: pointer;
  }
  #speed::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #4caf50;
    cursor: pointer;
  }
  #speed-val { min-width: 28px; text-align: right; }

  #status {
    position: absolute;
    top: 55px;
    right: 14px;
    z-index: 1000;
    font-size: 9px;
    color: #388e3c;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  #basemap-panel {
    position: absolute;
    top: 55px;
    left: 14px;
    z-index: 1000;
    background: rgba(0,0,0,0.72);
    border: 1px solid #1b5e20;
    border-radius: 3px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    backdrop-filter: blur(6px);
  }
  #basemap-panel label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 9px;
    letter-spacing: 1px;
    color: #4caf50;
    text-transform: uppercase;
  }
  #basemap-panel select {
    background: #000;
    color: #69f0ae;
    border: 1px solid #388e3c;
    font-family: inherit;
    font-size: 10px;
    padding: 2px 4px;
    border-radius: 2px;
    outline: none;
  }
  #basemap-panel input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 90px;
    height: 2px;
    background: #1b5e20;
    outline: none;
    cursor: pointer;
  }
  #basemap-panel input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #69f0ae;
    cursor: pointer;
  }
  #basemap-opacity-val {
    color: #69f0ae;
    min-width: 28px;
    text-align: right;
  }
</style>
    <script defer type="module" src="../js/analytics.js"></script>
</head>
<body>

<div id="header">
  <h1>🌍 Earth Timelapse</h1>
  <div id="year-display">1984</div>
  <span style="font-size:10px;color:#388e3c;letter-spacing:1px;">1984 – 2022</span>
  <span id="level-info" style="font-size:10px;color:#4caf50;letter-spacing:1px;margin-left:auto;"></span>
  <a id="ee-link" href="#" target="_blank" rel="noopener"
     style="background:none;border:1px solid #388e3c;color:#69f0ae;font-family:inherit;
            font-size:10px;letter-spacing:2px;padding:4px 10px;border-radius:2px;
            text-decoration:none;text-transform:uppercase;">Open in EE ↗</a>
</div>

<div id="map"></div>
<div id="status">loading tiles…</div>

<div id="basemap-panel">
  <label>BASE
    <select id="basemap-select">
      <option value="dark">Dark</option>
      <option value="osm">OSM</option>
      <option value="off">Off</option>
    </select>
  </label>
  <label>OPACITY
    <input type="range" id="basemap-opacity" min="0" max="1" step="0.05" value="0.35">
    <span id="basemap-opacity-val">0.35</span>
  </label>
  <label>3D TERRAIN
    <input type="checkbox" id="terrain-toggle">
  </label>
  <label>HEIGHT
    <input type="range" id="terrain-exag" min="0" max="5" step="0.1" value="1.5" disabled>
    <span id="terrain-exag-val">1.5×</span>
  </label>
</div>

<div id="controls">
  <div id="year-big">1984</div>

  <div id="scrubber-row">
    <input type="range" id="scrubber" min="0" max="38" step="1" value="0">
  </div>
  <div class="year-labels">
    <span>1984</span><span>1990</span><span>1996</span><span>2002</span>
    <span>2008</span><span>2014</span><span>2022</span>
  </div>

  <div id="player-row">
    <button id="btn-prev" class="timeline-btn" title="Previous year (←)">⏮</button>
    <button id="btn-play" class="timeline-btn">▶ Play</button>
    <button id="btn-next" class="timeline-btn" title="Next year (→)">⏭</button>
    <div id="speed-row">
      SPEED <input type="range" id="speed" min="0.1" max="5" step="0.1" value="1">
      <span id="speed-val">1×</span>
    </div>
  </div>
</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// EE Timelapse (CMU Time Machine) tile pyramid:
//   URL: {BASE}/{level}/{r*STRIDE}/{c*STRIDE}.mp4
//     - row first then col, both multiplied by STRIDE=4 (per Time Machine
//       sparse-mode URL builder: `ti.l/ti.r*4/ti.c*4`)
//     - each video covers 4×4 LEVEL_INFO source cells (1068×600 mp4 over a
//       wider-than-tall mercator rectangle)
//   Projection: Web Mercator clamped to ±85° latitude.
//   LEVEL_INFO from .../1068x600/r.json `level_info`.
const BASE = 'https://storage.googleapis.com/earthengine-timelapse/2023/cmu/1984_2022/1068x600';

// Pyramid geometry, from /1068x600/r.json:
//   width=2504688, height=2496483        — full image at max level (px)
//   tile_width=356, tile_height=200      — source-cell px
//   video_width=1424, video_height=800   — px per video tile (=4×source)
// EE's TileView positions tiles by max-level pixel coords (NOT by the
// per-level source-cell grid in level_info, which is slightly narrower
// than the true pano width and causes ~0.1° eastward drift).
const PANO_W    = 2504688;
const PANO_H    = 2496483;
const TILE_W    = 1424;       // = 4 × source tile_width
const TILE_H    = 800;        // = 4 × source tile_height
const STRIDE    = 4;          // URL filename step in source-cell units
const MAX_LEVEL = 12;         // 13 pyramid levels (per r.json nlevels)
const MERC_MAX  = Math.asinh(Math.tan(85 * Math.PI / 180));   // ≈ 3.1313
const YEAR_START      = 1984;
const YEAR_END        = 2022;
const NUM_YEARS       = YEAR_END - YEAR_START + 1;   // 39 frames (1 per year)
const SECONDS_PER_YEAR = 0.3;  // base pacing; multiplied by playbackSpeed

// URL convention (sparse, `_renumberDensely=false`):
//   {BASE}/{level}/{row*STRIDE}/{col*STRIDE}.mp4
// where (row, col) are video-grid indices.

const log = (...a) => console.log('%c[timelapse]', 'color:#69f0ae', ...a);

// ─── URL HASH (#lat,lon,zoom) ────────────────────────────────────────────────
function readHash() {
  const m = location.hash.match(/^#(-?[\d.]+),(-?[\d.]+),(-?[\d.]+)/);
  if (!m) return null;
  const lat = +m[1], lon = +m[2], zoom = +m[3];
  if (![lat, lon, zoom].every(Number.isFinite)) return null;
  return {lat, lon, zoom};
}
function writeHash() {
  const c = map.getCenter();
  const h = `#${c.lat.toFixed(5)},${c.lng.toFixed(5)},${map.getZoom().toFixed(2)}`;
  if (location.hash !== h) history.replaceState(null, '', h);
}

// ─── MAP ─────────────────────────────────────────────────────────────────────
const initial = readHash() || {lat: 15.45, lon: 73.85, zoom: 12};
log('init', initial);

mapboxgl.accessToken = 'pk.eyJ1Ijoib3NtaW5kaWEiLCJhIjoiY202czRpbWdpMDNyZjJwczJqZXdkMGR1eSJ9.eQQf--msfqtZIamJN-KKVQ';

const map = new mapboxgl.Map({
  container: 'map',
  // Minimal empty style: a single dark background. All overlays/basemaps are
  // added as raster sources at runtime so we don't depend on any Mapbox-hosted
  // style or glyphs.
  style: {
    version: 8,
    sources: {},
    layers: [{
      id: 'background',
      type: 'background',
      paint: {'background-color': '#0a0d12'},
    }],
  },
  center: [initial.lon, initial.lat],
  zoom: initial.zoom,
  maxBounds: [[-180, -85], [180, 85]],
  renderWorldCopies: false,
  projection: 'mercator',
  attributionControl: false,
});
map.addControl(new mapboxgl.NavigationControl({visualizePitch: true}), 'top-right');
map.addControl(new mapboxgl.AttributionControl({customAttribution: 'Earth Engine Timelapse'}), 'bottom-right');

// ─── BASEMAP SWITCHER ────────────────────────────────────────────────────────
// Basemap renders ABOVE the video overlays so labels/streets stay visible; the
// opacity slider controls how much it obscures the imagery. We enforce this by
// re-ordering: after every video-layer addition we call moveLayer to push the
// basemap layer back on top.
const BASEMAP_LAYER_ID = 'basemap-layer';
const BASEMAP_SOURCE_ID = 'basemap-source';

const BASEMAPS = {
  dark: {
    tiles: [
      'https://a.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png',
      'https://b.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png',
      'https://c.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png',
      'https://d.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png',
    ],
    attribution: '© OpenStreetMap © CARTO',
    maxzoom: 18,
  },
  osm: {
    tiles: [
      'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
      'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
      'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png',
    ],
    attribution: '© OpenStreetMap',
    maxzoom: 19,
  },
};

let currentBasemap = null;
function removeBasemap() {
  if (map.getLayer(BASEMAP_LAYER_ID)) map.removeLayer(BASEMAP_LAYER_ID);
  if (map.getSource(BASEMAP_SOURCE_ID)) map.removeSource(BASEMAP_SOURCE_ID);
  currentBasemap = null;
}
function setBasemap(name) {
  removeBasemap();
  if (name === 'off') { log('basemap', name); return; }
  const cfg = BASEMAPS[name];
  if (!cfg) return;
  map.addSource(BASEMAP_SOURCE_ID, {
    type: 'raster',
    tiles: cfg.tiles,
    tileSize: 256,
    maxzoom: cfg.maxzoom,
    attribution: cfg.attribution,
  });
  map.addLayer({
    id: BASEMAP_LAYER_ID,
    type: 'raster',
    source: BASEMAP_SOURCE_ID,
    paint: {
      'raster-opacity': parseFloat(document.getElementById('basemap-opacity').value),
    },
  });
  currentBasemap = name;
  log('basemap', name);
}
function liftBasemap() {
  if (currentBasemap && map.getLayer(BASEMAP_LAYER_ID)) {
    map.moveLayer(BASEMAP_LAYER_ID);
  }
}

document.getElementById('basemap-select').addEventListener('change', e => setBasemap(e.target.value));
document.getElementById('basemap-opacity').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  document.getElementById('basemap-opacity-val').textContent = v.toFixed(2);
  if (currentBasemap && map.getLayer(BASEMAP_LAYER_ID)) {
    map.setPaintProperty(BASEMAP_LAYER_ID, 'raster-opacity', v);
  }
});

// ─── 3D TERRAIN ──────────────────────────────────────────────────────────────
const TERRAIN_SOURCE_ID = 'mapbox-dem';
const terrainToggle = document.getElementById('terrain-toggle');
const terrainExag   = document.getElementById('terrain-exag');
const terrainExagVal = document.getElementById('terrain-exag-val');

function applyTerrain() {
  if (!map.getSource(TERRAIN_SOURCE_ID)) return;
  if (terrainToggle.checked) {
    map.setTerrain({source: TERRAIN_SOURCE_ID, exaggeration: parseFloat(terrainExag.value)});
    terrainExag.disabled = false;
  } else {
    map.setTerrain(null);
    terrainExag.disabled = true;
  }
}
terrainToggle.addEventListener('change', applyTerrain);
terrainExag.addEventListener('input', () => {
  const v = parseFloat(terrainExag.value);
  terrainExagVal.textContent = v.toFixed(1) + '×';
  if (terrainToggle.checked && map.getSource(TERRAIN_SOURCE_ID)) {
    map.setTerrain({source: TERRAIN_SOURCE_ID, exaggeration: v});
  }
});

// ─── TILE PROJECTION MATH ────────────────────────────────────────────────────
function lat2mercY(lat) {
  const c = Math.max(-85, Math.min(85, lat));
  return Math.asinh(Math.tan(c * Math.PI / 180));
}
function mercY2Lat(y) {
  return Math.atan(Math.sinh(y)) * 180 / Math.PI;
}
function levelScaleAt(level) { return Math.pow(2, MAX_LEVEL - level); }

function videoGrid(level) {
  const s = levelScaleAt(level);
  return {
    vcols: Math.ceil(PANO_W / (TILE_W * s)),
    vrows: Math.ceil(PANO_H / (TILE_H * s)),
  };
}
function tileBounds(level, row, col) {
  // Tile (row, col) covers max-level pixel rect
  //   x ∈ [col   * TILE_W * s, (col+1) * TILE_W * s)
  //   y ∈ [row   * TILE_H * s, (row+1) * TILE_H * s)
  // where s = 2^(MAX_LEVEL − level). Convert to lat/lng via PANO_W/PANO_H.
  const s = levelScaleAt(level);
  const xL = col * TILE_W * s, xR = (col + 1) * TILE_W * s;
  const yT = row * TILE_H * s, yB = (row + 1) * TILE_H * s;
  const west = -180 + Math.min(1, xL / PANO_W) * 360;
  const east = -180 + Math.min(1, xR / PANO_W) * 360;
  const ymT  = MERC_MAX * (1 - 2 * Math.min(1, yT / PANO_H));
  const ymB  = MERC_MAX * (1 - 2 * Math.min(1, yB / PANO_H));
  return {west, east, south: mercY2Lat(ymB), north: mercY2Lat(ymT)};
}
function pickLevel(zoom) {
  // EE's scale2level rounds map zoom to the nearest pyramid level. Verified
  // empirically: at map zoom 8.8 EE loads level 9.
  return Math.max(0, Math.min(MAX_LEVEL, Math.round(zoom)));
}
function visibleTiles(level, bounds) {
  const s = levelScaleAt(level);
  const {vcols, vrows} = videoGrid(level);
  const west  = Math.max(-180, bounds.getWest());
  const east  = Math.min( 180, bounds.getEast());
  const south = Math.max(-85,  bounds.getSouth());
  const north = Math.min( 85,  bounds.getNorth());
  if (east <= west || north <= south) return [];
  const pxW = (west + 180) / 360 * PANO_W;
  const pxE = (east + 180) / 360 * PANO_W;
  const pxN = (MERC_MAX - lat2mercY(north)) / (2 * MERC_MAX) * PANO_H;
  const pxS = (MERC_MAX - lat2mercY(south)) / (2 * MERC_MAX) * PANO_H;
  const colMin = Math.max(0,         Math.floor(pxW / (TILE_W * s)));
  const colMax = Math.min(vcols - 1, Math.floor(pxE / (TILE_W * s)));
  const rowMin = Math.max(0,         Math.floor(pxN / (TILE_H * s)));
  const rowMax = Math.min(vrows - 1, Math.floor(pxS / (TILE_H * s)));
  const tiles = [];
  for (let r = rowMin; r <= rowMax; r++)
    for (let c = colMin; c <= colMax; c++)
      tiles.push({level, row: r, col: c, key: `${level}/${r}/${c}`});
  return tiles;
}

// ─── STATE ───────────────────────────────────────────────────────────────────
// EE serves a byte-identical 3787-byte stub mp4 for every (level,row,col) with
// no imagery. Skipping those prevents the visible "same video tiled" pattern.
const STUB_BYTES = 3787;
const probeCache = new Map();   // url → Promise<{ok, len}> (true = real tile)

function probeTile(url) {
  let p = probeCache.get(url);
  if (!p) {
    p = fetch(url, {method: 'HEAD'})
      .then(r => {
        const len = parseInt(r.headers.get('content-length') || '0', 10);
        return {ok: r.ok && len > STUB_BYTES, len};
      })
      .catch(e => { log('probe failed', url, e); return {ok: false, len: 0}; });
    probeCache.set(url, p);
  }
  return p;
}

const active = new Map();   // key → {sourceId, video, probing}
let currentYearIdx  = 0;        // 0..NUM_YEARS-1
let yearAccumulator = 0;        // fractional progress toward next year while playing
let isPlaying       = false;
let animFrame       = null;
let lastTimestamp   = null;
let playbackSpeed   = 1;
const LOOP_PAUSE_MS = 1000;     // hold on the last year before wrapping back to start
let loopPauseUntil  = 0;        // ms timestamp; 0 = not in loop-pause

function updateStatus() {
  let loaded = 0;
  for (const {video} of active.values())
    if (video && video.readyState >= 1) loaded++;
  document.getElementById('status').textContent =
    `${loaded}/${active.size} tile${active.size !== 1 ? 's' : ''} loaded`;
}

// ─── VIDEO SYNC ──────────────────────────────────────────────────────────────
// We drive the displayed frame via `currentTime` rather than native playback.
// Two constraints make this tricky:
//   1. Mapbox-GL's VideoSource.prepare() only uploads a new frame to the WebGL
//      texture when `video.paused === false` — pausing the video freezes the
//      tile on whatever frame was uploaded first.
//   2. If we let the video play at native rate, the displayed frame races the
//      JS year counter and looks unsynced.
// The workaround: keep `paused === false` but set `playbackRate = 0`. The
// video is technically "playing" so mapbox keeps refreshing the texture, but
// currentTime stays put wherever we seek it.
function commandeerVideo(video) {
  if (!video || video.__commandeered) return;
  video.__commandeered = true;
  video.loop = false;
  video.muted = true;
  video.playsInline = true;
  video.preload = 'auto';
  try { video.playbackRate = 0; } catch (_) {}
  // Some browsers may reset playbackRate after seeking; clamp it back.
  video.addEventListener('ratechange', () => {
    if (video.playbackRate !== 0) {
      try { video.playbackRate = 0; } catch (_) {}
    }
  });
}
function startVideo(video) {
  if (!video) return;
  try { video.playbackRate = 0; } catch (_) {}
  if (video.paused) {
    const p = video.play();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  }
}
function syncOne(video) {
  if (!video || !video.duration || isNaN(video.duration)) return;
  commandeerVideo(video);
  // Aim at the center of the year's slice of the video timeline. With N years
  // and N frames, this lands between frame i and i+1 → browsers display frame i.
  const target = (currentYearIdx + 0.5) / NUM_YEARS * video.duration;
  if (Math.abs(video.currentTime - target) > 0.005) video.currentTime = target;
  startVideo(video);
  map.triggerRepaint();
}
function syncAll() {
  for (const {video} of active.values()) syncOne(video);
  map.triggerRepaint();
}
function pauseAll(){ /* no-op: videos stay at playbackRate=0; JS timeline controls advancement */ }

// ─── TILE LIFECYCLE ──────────────────────────────────────────────────────────
function sourceIdFor(level, row, col) { return `video-${level}-${row}-${col}`; }

function removeTile(key) {
  const entry = active.get(key);
  if (!entry) return;
  if (entry.video) { try { entry.video.pause(); } catch (_) {} }
  if (entry.sourceId) {
    if (map.getLayer(entry.sourceId)) map.removeLayer(entry.sourceId);
    if (map.getSource(entry.sourceId)) map.removeSource(entry.sourceId);
  }
  active.delete(key);
}

function tileUrl(level, row, col) {
  return `${BASE}/${level}/${row * STRIDE}/${col * STRIDE}.mp4`;
}

function refreshTiles() {
  const zoom  = map.getZoom();
  const level = pickLevel(zoom);
  const tiles = visibleTiles(level, map.getBounds());
  const wanted = new Set(tiles.map(t => t.key));
  const {vcols, vrows} = videoGrid(level);

  log(`refresh zoom=${zoom.toFixed(2)} level=${level} grid=${vcols}×${vrows} visible=${tiles.length}`);
  document.getElementById('level-info').textContent =
    `Z${zoom.toFixed(1)} · L${level} · ${tiles.length} tiles`;

  let removed = 0;
  for (const key of Array.from(active.keys())) {
    if (!wanted.has(key)) { removeTile(key); removed++; }
  }
  if (removed) log(`removed ${removed} stale tiles`);

  for (const t of tiles) {
    if (active.has(t.key)) continue;
    const url = tileUrl(t.level, t.row, t.col);
    const entry = {sourceId: null, video: null, probing: true};
    active.set(t.key, entry);

    probeTile(url).then(({ok, len}) => {
      if (active.get(t.key) !== entry) return;
      entry.probing = false;
      if (!ok) {
        log(`skip stub L${t.level} r=${t.row} c=${t.col} (${len}B)`, url);
        active.delete(t.key);
        return;
      }
      const b = tileBounds(t.level, t.row, t.col);
      log(`add  L${t.level} r=${t.row} c=${t.col} (${(len/1e6).toFixed(2)}MB) ` +
          `bounds=[S${b.south.toFixed(3)},W${b.west.toFixed(3)},` +
          `N${b.north.toFixed(3)},E${b.east.toFixed(3)}]`);

      const sourceId = sourceIdFor(t.level, t.row, t.col);
      entry.sourceId = sourceId;
      // Mapbox video sources expect coordinates in [tl, tr, br, bl] order,
      // each as [lng, lat].
      map.addSource(sourceId, {
        type: 'video',
        urls: [url],
        coordinates: [
          [b.west, b.north],
          [b.east, b.north],
          [b.east, b.south],
          [b.west, b.south],
        ],
      });
      map.addLayer({
        id: sourceId,
        type: 'raster',
        source: sourceId,
        paint: {'raster-fade-duration': 0},
      });
      liftBasemap();

      // Mapbox loads the video asynchronously; the <video> element only
      // becomes available some time after addSource(). Poll until it exists,
      // then commandeer it (loop=false, playbackRate=0).
      const bindWhenReady = (attempt = 0) => {
        if (active.get(t.key) !== entry) return;
        const src = map.getSource(sourceId);
        if (!src) return;
        const video = typeof src.getVideo === 'function' ? src.getVideo() : null;
        if (!video) {
          if (attempt < 200) setTimeout(() => bindWhenReady(attempt + 1), 50);
          return;
        }
        commandeerVideo(video);
        entry.video = video;

        const onMeta = () => {
          if (active.get(t.key) !== entry) return;
          syncOne(video);
          updateStatus();
        };
        if (video.readyState >= 1 && video.duration && !isNaN(video.duration)) onMeta();
        else video.addEventListener('loadedmetadata', onMeta, {once: true});

        video.addEventListener('error', e => {
          log(`error L${t.level} r=${t.row} c=${t.col}`, e);
          removeTile(t.key);
        });
        updateStatus();
      };
      bindWhenReady();
    });
  }
  updateStatus();
}

// ─── YEAR UI ─────────────────────────────────────────────────────────────────
const yearDisplay = document.getElementById('year-display');
const yearBig     = document.getElementById('year-big');
const scrubber    = document.getElementById('scrubber');

function updateYearUI() {
  const y = YEAR_START + currentYearIdx;
  yearDisplay.textContent = y;
  yearBig.textContent = y;
  if (+scrubber.value !== currentYearIdx) scrubber.value = currentYearIdx;
}

function setYear(idx, {fromScrub = false} = {}) {
  currentYearIdx = ((idx % NUM_YEARS) + NUM_YEARS) % NUM_YEARS;
  if (!fromScrub) yearAccumulator = 0;
  loopPauseUntil = 0;
  updateYearUI();
  syncAll();
}

// ─── ANIMATION LOOP ──────────────────────────────────────────────────────────
function tick(ts) {
  if (lastTimestamp === null) lastTimestamp = ts;
  const dt = (ts - lastTimestamp) / 1000;
  lastTimestamp = ts;

  // Loop-pause: hold on the last year for LOOP_PAUSE_MS before wrapping to 0.
  if (loopPauseUntil > 0) {
    if (ts >= loopPauseUntil) {
      loopPauseUntil = 0;
      currentYearIdx = 0;
      yearAccumulator = 0;
      updateYearUI();
      syncAll();
    }
    if (isPlaying) animFrame = requestAnimationFrame(tick);
    return;
  }

  yearAccumulator += dt * playbackSpeed / SECONDS_PER_YEAR;
  if (yearAccumulator >= 1) {
    const steps = Math.floor(yearAccumulator);
    yearAccumulator -= steps;
    const next = currentYearIdx + steps;
    if (next >= NUM_YEARS - 1) {
      if (currentYearIdx !== NUM_YEARS - 1) {
        currentYearIdx = NUM_YEARS - 1;
        updateYearUI();
        syncAll();
      }
      loopPauseUntil = ts + LOOP_PAUSE_MS;
    } else {
      currentYearIdx = next;
      updateYearUI();
      syncAll();
    }
  }
  if (isPlaying) animFrame = requestAnimationFrame(tick);
}

// ─── CONTROLS ────────────────────────────────────────────────────────────────
const btnPlay     = document.getElementById('btn-play');
const btnPrev     = document.getElementById('btn-prev');
const btnNext     = document.getElementById('btn-next');
const speedSlider = document.getElementById('speed');
const speedVal    = document.getElementById('speed-val');

btnPlay.addEventListener('click', () => {
  isPlaying = !isPlaying;
  log(isPlaying ? 'play' : 'pause');
  if (isPlaying) {
    lastTimestamp = null;
    yearAccumulator = 0;
    loopPauseUntil = 0;
    animFrame = requestAnimationFrame(tick);
    btnPlay.textContent = '⏸ Pause';
  } else {
    cancelAnimationFrame(animFrame);
    pauseAll();
    loopPauseUntil = 0;
    btnPlay.textContent = '▶ Play';
  }
});

btnPrev.addEventListener('click', () => setYear(currentYearIdx - 1));
btnNext.addEventListener('click', () => setYear(currentYearIdx + 1));

scrubber.addEventListener('input', () => {
  setYear(parseInt(scrubber.value, 10), {fromScrub: true});
  lastTimestamp = null;
});

speedSlider.addEventListener('input', () => {
  playbackSpeed = parseFloat(speedSlider.value);
  speedVal.textContent = playbackSpeed.toFixed(1) + '×';
});

// Arrow keys for year stepping. Ignore when typing in form fields.
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft')  { setYear(currentYearIdx - 1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { setYear(currentYearIdx + 1); e.preventDefault(); }
  else if (e.key === ' ')          { btnPlay.click(); e.preventDefault(); }
});

// Refresh tiles on pan/zoom (debounced).
let refreshScheduled = null;
function scheduleRefresh() {
  if (refreshScheduled) clearTimeout(refreshScheduled);
  refreshScheduled = setTimeout(() => { refreshScheduled = null; refreshTiles(); }, 120);
}

function updateEELink() {
  const c = map.getCenter();
  const z = map.getZoom();
  document.getElementById('ee-link').href =
    `https://earthengine.google.com/timelapse/#v=${c.lat.toFixed(5)},${c.lng.toFixed(5)},${z.toFixed(2)},latLng`;
}

map.on('moveend', () => { writeHash(); updateEELink(); scheduleRefresh(); });
map.on('zoomend', () => { writeHash(); updateEELink(); scheduleRefresh(); });
window.addEventListener('hashchange', () => {
  const h = readHash();
  if (h) map.jumpTo({center: [h.lon, h.lat], zoom: h.zoom});
});

map.on('load', () => {
  map.addSource(TERRAIN_SOURCE_ID, {
    type: 'raster-dem',
    url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
    tileSize: 512,
    maxzoom: 14,
  });
  setBasemap('dark');
  writeHash();
  updateEELink();
  refreshTiles();
  setTimeout(() => btnPlay.click(), 800);
});
</script>
